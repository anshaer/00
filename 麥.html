<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網頁音訊傳輸 QR版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe2ea;
  --blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:920px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 14px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-size:17px;font-weight:800}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
button,select,textarea,input{font:inherit}
button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;min-height:44px}
.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}
.danger{background:var(--red);color:#fff}.warn{background:var(--orange);color:#fff}.ghost{background:#eef2f7;color:#111827}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:11px}
textarea{height:92px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.status{font-weight:800}.small{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9ca3af;margin-right:7px}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
.meter{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.qrbox{text-align:center}
.qrstage{display:flex;justify-content:center;align-items:center;min-height:260px;padding:12px;background:white;border:1px dashed var(--line);border-radius:14px;margin-top:10px;overflow:auto}
.qrstage canvas,.qrstage img{max-width:100%;height:auto!important}
.qrmeta{font-size:13px;color:var(--muted);margin-top:8px}
.filebtn{display:inline-flex;align-items:center;justify-content:center;background:#111827;color:#fff;border-radius:11px;padding:11px 14px;font-weight:800;min-height:44px;cursor:pointer}
.filebtn input{display:none}
.hidden{display:none!important}
.sep{height:1px;background:var(--line);margin:14px 0}
audio{width:100%;margin-top:10px}
@media(max-width:600px){.wrap{padding:10px}.card{padding:14px}.qrstage{min-height:230px}}
</style>
</head>
<body>
<div class="wrap">
<h1>網頁音訊傳輸</h1>

<div class="tabs">
  <button class="tab active" data-tab="send">傳送</button>
  <button class="tab" data-tab="recv">接收</button>
</div>

<section id="send" class="panel active">
  <div class="card">
    <div class="status"><span id="sendDot" class="dot"></span><span id="sendStatus">尚未啟動麥克風</span></div>
    <div class="small" style="margin-top:6px">WebRTC 即時傳送。QR 只負責交換連線資訊，不承載音訊。</div>
  </div>

  <div class="card">
    <label>麥克風</label>
    <select id="micSelect"></select>
    <div class="row" style="margin-top:10px">
      <button id="startMic" class="primary">啟動麥克風</button>
      <button id="muteMic" class="warn" disabled>暫停傳送</button>
      <button id="stopSend" class="danger" disabled>停止</button>
    </div>
    <div style="margin-top:14px">
      <label>輸入音量</label>
      <div class="meter"><div id="sendMeter" class="bar"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="createOffer" class="success" disabled>1. 產生 Offer QR</button>
    </div>
    <div id="offerQRWrap" class="qrbox hidden">
      <div id="offerQR" class="qrstage"></div>
      <div id="offerQRMeta" class="qrmeta"></div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button id="offerPrev" class="ghost">上一張</button>
        <button id="offerNext" class="ghost">下一張</button>
        <button id="downloadOfferQR" class="primary">下載目前 QR</button>
      </div>
    </div>

    <div class="sep"></div>
    <label>3. 讀取接收端 Answer QR</label>
    <div class="row">
      <label class="filebtn">讀取 QR 圖片<input id="answerQRFile" type="file" accept="image/*"></label>
      <button id="applyAnswer" class="primary" disabled>套用 Answer</button>
    </div>
    <div id="answerReadStatus" class="small" style="margin-top:9px">尚未讀取</div>

    <details style="margin-top:12px">
      <summary class="small">顯示文字資料（備援）</summary>
      <textarea id="offerOut" placeholder="Offer"></textarea>
      <textarea id="answerIn" placeholder="Answer"></textarea>
    </details>
  </div>
</section>

<section id="recv" class="panel">
  <div class="card">
    <div class="status"><span id="recvDot" class="dot"></span><span id="recvStatus">等待 Offer QR</span></div>
    <div class="small" style="margin-top:6px">可用手機相簿、截圖、下載的 PNG 直接讀 QR。</div>
  </div>

  <div class="card">
    <label>2. 讀取傳送端 Offer QR</label>
    <div class="row">
      <label class="filebtn">讀取 QR 圖片<input id="offerQRFile" type="file" accept="image/*"></label>
      <button id="createAnswer" class="success" disabled>產生 Answer QR</button>
    </div>
    <div id="offerReadStatus" class="small" style="margin-top:9px">尚未讀取</div>

    <div id="answerQRWrap" class="qrbox hidden" style="margin-top:14px">
      <div id="answerQR" class="qrstage"></div>
      <div id="answerQRMeta" class="qrmeta"></div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button id="answerPrev" class="ghost">上一張</button>
        <button id="answerNext" class="ghost">下一張</button>
        <button id="downloadAnswerQR" class="primary">下載目前 QR</button>
      </div>
    </div>

    <details style="margin-top:12px">
      <summary class="small">顯示文字資料（備援）</summary>
      <textarea id="offerIn" placeholder="Offer"></textarea>
      <textarea id="answerOut" placeholder="Answer"></textarea>
    </details>
  </div>

  <div class="card">
    <label>接收音量</label>
    <div class="meter"><div id="recvMeter" class="bar"></div></div>
    <div class="row" style="margin-top:10px">
      <button id="playAudio" class="primary" disabled>開始播放</button>
      <button id="stopRecv" class="danger" disabled>停止接收</button>
    </div>
    <audio id="remoteAudio" autoplay playsinline controls></audio>
  </div>
</section>

<div class="card small">
QR 資料會先壓縮；若仍過長會自動切成多張。多張時請依序讀取每一張，全部收齊後才會啟用下一步。<br>
手機取得麥克風通常需要 HTTPS。若 iPhone/iPad 沒自動出聲，請按「開始播放」。
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let sendPC=null,recvPC=null,localStream=null,sendCtx=null,recvCtx=null,sendRAF=0,recvRAF=0;
let qrSets={offer:[],answer:[]}, qrIndex={offer:0,answer:0};
const receivedParts={offer:{},answer:{}};

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');$(b.dataset.tab).classList.add('active');
}));

function setStatus(type,text,state=''){
  $(type+'Status').textContent=text;
  $(type+'Dot').className='dot '+state;
}
async function listMics(){
  try{
    const ds=await navigator.mediaDevices.enumerateDevices(), ms=ds.filter(d=>d.kind==='audioinput');
    $('micSelect').innerHTML='';
    ms.forEach((d,i)=>{
      const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`麥克風 ${i+1}`;$('micSelect').appendChild(o);
    });
  }catch(_){}
}
listMics();
navigator.mediaDevices?.addEventListener?.('devicechange',listMics);

function meterFromStream(stream,barId,kind){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream),a=ctx.createAnalyser();a.fftSize=512;src.connect(a);
  const data=new Uint8Array(a.frequencyBinCount);
  const loop=()=>{
    a.getByteTimeDomainData(data);let sum=0;
    for(const v of data){const x=(v-128)/128;sum+=x*x}
    $(barId).style.width=Math.min(100,Math.sqrt(sum/data.length)*240)+'%';
    const n=requestAnimationFrame(loop); if(kind==='send')sendRAF=n;else recvRAF=n;
  };loop();return ctx;
}
function pcConfig(){return {iceServers:[{urls:'stun:stun.l.google.com:19302'}]}}
async function waitIce(pc){
  if(pc.iceGatheringState==='complete')return;
  await new Promise(resolve=>{
    const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);resolve()}};
    pc.addEventListener('icegatheringstatechange',f);setTimeout(resolve,6000);
  });
}
function b64url(bytes){
  let s=''; for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64url(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='=';
  const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a;
}
async function packText(text){
  const raw=new TextEncoder().encode(text);
  if('CompressionStream' in window){
    try{
      const cs=new CompressionStream('deflate');
      const out=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();
      return 'z'+b64url(new Uint8Array(out));
    }catch(_){}
  }
  return 'r'+b64url(raw);
}
async function unpackText(data){
  const mode=data[0],bytes=fromB64url(data.slice(1));
  if(mode==='z'){
    if(!('DecompressionStream' in window))throw new Error('此瀏覽器不支援解壓縮');
    const ds=new DecompressionStream('deflate');
    const out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(out);
  }
  return new TextDecoder().decode(bytes);
}
function makeQRParts(kind,packed){
  const sid=Math.random().toString(36).slice(2,8);
  const max=1500, total=Math.ceil(packed.length/max), parts=[];
  for(let i=0;i<total;i++){
    const payload=packed.slice(i*max,(i+1)*max);
    parts.push(`WA1|${kind}|${sid}|${i+1}|${total}|${payload}`);
  }
  return parts;
}
function renderQR(kind){
  const parts=qrSets[kind], idx=qrIndex[kind], box=$(kind+'QR'), wrap=$(kind+'QRWrap'), meta=$(kind+'QRMeta');
  if(!parts.length)return;
  wrap.classList.remove('hidden'); box.innerHTML='';
  try{
    new QRCode(box,{text:parts[idx],width:300,height:300,correctLevel:QRCode.CorrectLevel.L});
    meta.textContent=`QR ${idx+1} / ${parts.length}　資料長度 ${parts[idx].length} 字元`;
    $(kind+'Prev').disabled=idx===0;$(kind+'Next').disabled=idx===parts.length-1;
  }catch(e){meta.textContent='QR 產生失敗：'+e.message}
}
function navQR(kind,delta){qrIndex[kind]=Math.max(0,Math.min(qrSets[kind].length-1,qrIndex[kind]+delta));renderQR(kind)}
$('offerPrev').onclick=()=>navQR('offer',-1);$('offerNext').onclick=()=>navQR('offer',1);
$('answerPrev').onclick=()=>navQR('answer',-1);$('answerNext').onclick=()=>navQR('answer',1);

function downloadQR(kind){
  const box=$(kind+'QR'), c=box.querySelector('canvas'), img=box.querySelector('img');
  let url=c?c.toDataURL('image/png'):img?.src;if(!url)return;
  const a=document.createElement('a');a.href=url;a.download=`${kind}_QR_${qrIndex[kind]+1}of${qrSets[kind].length}.png`;a.click();
}
$('downloadOfferQR').onclick=()=>downloadQR('offer');
$('downloadAnswerQR').onclick=()=>downloadQR('answer');

async function decodeQRFile(file){
  if(typeof jsQR!=='function')throw new Error('QR 解碼器載入失敗，請確認網路');
  const bmp=await createImageBitmap(file);
  const max=1800, scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),code=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});
  if(!code)throw new Error('圖片中找不到可辨識的 QR');
  return code.data;
}
async function acceptQR(data,expected,statusId,targetId){
  const m=data.match(/^WA1\|(offer|answer)\|([^|]+)\|(\d+)\|(\d+)\|(.+)$/s);
  if(!m)throw new Error('不是本工具產生的 QR');
  const [,kind,sid,n0,t0,payload]=m;
  if(kind!==expected)throw new Error(`這是 ${kind} QR，不是 ${expected}`);
  const n=+n0,total=+t0,key=sid;
  if(!receivedParts[kind][key])receivedParts[kind][key]={total,parts:{}};
  receivedParts[kind][key].parts[n]=payload;
  const obj=receivedParts[kind][key],count=Object.keys(obj.parts).length;
  $(statusId).textContent=`已讀取 ${count} / ${total} 張`;
  if(count===total){
    let packed='';for(let i=1;i<=total;i++)packed+=obj.parts[i];
    const text=await unpackText(packed);$(targetId).value=text;
    $(statusId).textContent=`已讀取完成，共 ${total} 張 QR`;
    return true;
  }
  return false;
}
$('offerQRFile').onchange=async e=>{
  try{
    const d=await decodeQRFile(e.target.files[0]);
    if(await acceptQR(d,'offer','offerReadStatus','offerIn'))$('createAnswer').disabled=false;
  }catch(err){$('offerReadStatus').textContent='讀取失敗：'+err.message}
  e.target.value='';
};
$('answerQRFile').onchange=async e=>{
  try{
    const d=await decodeQRFile(e.target.files[0]);
    if(await acceptQR(d,'answer','answerReadStatus','answerIn'))$('applyAnswer').disabled=false;
  }catch(err){$('answerReadStatus').textContent='讀取失敗：'+err.message}
  e.target.value='';
};

$('startMic').onclick=async()=>{
  try{
    if(localStream)localStream.getTracks().forEach(t=>t.stop());
    const id=$('micSelect').value;
    localStream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    await listMics();if(sendCtx)sendCtx.close();sendCtx=meterFromStream(localStream,'sendMeter','send');
    setStatus('send','麥克風已啟動','ok');$('createOffer').disabled=false;$('muteMic').disabled=false;$('stopSend').disabled=false;
  }catch(e){setStatus('send',`麥克風啟動失敗：${e.name || ''} ${e.message || e}`,'bad')}
};
$('muteMic').onclick=()=>{
  if(!localStream)return;const t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;
  $('muteMic').textContent=t.enabled?'暫停傳送':'恢復傳送';setStatus('send',t.enabled?'麥克風傳送中':'已暫停傳送',t.enabled?'ok':'');
};
$('createOffer').onclick=async()=>{
  try{
    if(typeof QRCode==='undefined')throw new Error('QR 產生器載入失敗，請確認網路');
    if(sendPC)sendPC.close();sendPC=new RTCPeerConnection(pcConfig());
    localStream.getTracks().forEach(t=>sendPC.addTrack(t,localStream));
    sendPC.onconnectionstatechange=()=>{const s=sendPC.connectionState;setStatus('send','連線狀態：'+s,s==='connected'?'ok':(s==='failed'||s==='closed')?'bad':'')};
    await sendPC.setLocalDescription(await sendPC.createOffer({offerToReceiveAudio:false}));await waitIce(sendPC);
    const text=JSON.stringify(sendPC.localDescription);$('offerOut').value=text;
    qrSets.offer=makeQRParts('offer',await packText(text));qrIndex.offer=0;renderQR('offer');
    setStatus('send',`Offer QR 已產生${qrSets.offer.length>1?'（共 '+qrSets.offer.length+' 張）':''}`,'');
  }catch(e){setStatus('send','產生 Offer 失敗：'+e.message,'bad')}
};
$('applyAnswer').onclick=async()=>{
  try{await sendPC.setRemoteDescription(JSON.parse($('answerIn').value));setStatus('send','Answer 已套用，正在連線…','')}
  catch(e){setStatus('send','套用 Answer 失敗：'+e.message,'bad')}
};
$('createAnswer').onclick=async()=>{
  try{
    if(typeof QRCode==='undefined')throw new Error('QR 產生器載入失敗，請確認網路');
    if(recvPC)recvPC.close();recvPC=new RTCPeerConnection(pcConfig());
    recvPC.ontrack=async e=>{
      const s=e.streams[0]||new MediaStream([e.track]);$('remoteAudio').srcObject=s;$('playAudio').disabled=false;$('stopRecv').disabled=false;
      if(recvCtx)recvCtx.close();recvCtx=meterFromStream(s,'recvMeter','recv');try{await $('remoteAudio').play()}catch(_){}
    };
    recvPC.onconnectionstatechange=()=>{const s=recvPC.connectionState;setStatus('recv','連線狀態：'+s,s==='connected'?'ok':(s==='failed'||s==='closed')?'bad':'')};
    await recvPC.setRemoteDescription(JSON.parse($('offerIn').value));
    await recvPC.setLocalDescription(await recvPC.createAnswer());await waitIce(recvPC);
    const text=JSON.stringify(recvPC.localDescription);$('answerOut').value=text;
    qrSets.answer=makeQRParts('answer',await packText(text));qrIndex.answer=0;renderQR('answer');
    setStatus('recv',`Answer QR 已產生${qrSets.answer.length>1?'（共 '+qrSets.answer.length+' 張）':''}`,'');
  }catch(e){setStatus('recv','建立 Answer 失敗：'+e.message,'bad')}
};
$('playAudio').onclick=async()=>{try{await $('remoteAudio').play();setStatus('recv','音訊播放中','ok')}catch(e){setStatus('recv','播放失敗：'+e.message,'bad')}};
$('stopSend').onclick=()=>{
  if(sendPC)sendPC.close();sendPC=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;
  if(sendCtx)sendCtx.close();sendCtx=null;cancelAnimationFrame(sendRAF);$('sendMeter').style.width='0%';
  $('createOffer').disabled=true;$('muteMic').disabled=true;$('stopSend').disabled=true;setStatus('send','已停止','');
};
$('stopRecv').onclick=()=>{
  if(recvPC)recvPC.close();recvPC=null;$('remoteAudio').pause();$('remoteAudio').srcObject=null;if(recvCtx)recvCtx.close();recvCtx=null;
  cancelAnimationFrame(recvRAF);$('recvMeter').style.width='0%';$('playAudio').disabled=true;$('stopRecv').disabled=true;setStatus('recv','已停止接收','');
};
</script>
</body>
</html>
