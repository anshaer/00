<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebRTC傳輸工具</title>

<!-- 僅 QR 編碼器；不參與 signaling / 傳檔 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#efefef;color:#000;font-family:Arial,"Microsoft JhengHei",sans-serif}
body.flash::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99999;
  background:rgba(0,255,48,.60);animation:f .5s linear 1
}
@keyframes f{0%{opacity:0}10%{opacity:1}85%{opacity:.8}100%{opacity:0}}

header{
  height:78px;background:#050505;color:white;display:flex;align-items:center;
  padding:0 15px;border-bottom:2px solid #999
}
header .title{font-size:29px;font-weight:400}
.lights{margin-left:auto;display:flex;gap:18px}
.light{width:23px;height:23px;border-radius:50%;background:#777;border:1px solid #333}
.light.ok{background:#15ee35;box-shadow:0 0 8px rgba(0,255,60,.5)}

main{max-width:760px;margin:auto;padding:22px 23px 18px}
button{
  width:100%;min-height:63px;border:2px solid #666;border-radius:12px;
  background:#f4f4f4;color:#000;font-size:28px;padding:8px 12px;cursor:pointer
}
button:active{background:#ddd}
button:disabled{opacity:.45}
#connectBtn{margin-bottom:12px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:12px 46px}
.box{
  position:relative;aspect-ratio:1/1;border:2px solid #666;border-radius:37px;
  overflow:hidden;background:#f4f4f4
}
.placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:29px;z-index:1
}
#qrImg,#cam{
  display:none;position:absolute;inset:0;width:100%;height:100%
}
#qrImg{object-fit:contain;background:#fff;padding:4px}
#cam{object-fit:cover;background:#111;transform:scaleX(-1)}
.badge{
  position:absolute;left:7px;right:7px;bottom:7px;z-index:5;
  border-radius:8px;padding:4px 6px;text-align:center;font-size:12px;
  background:rgba(255,255,255,.92)
}
#scanBadge{background:rgba(0,0,0,.76);color:white}
.hidden{display:none!important}

#addBtn{margin:12px 0}
#fileInput{display:none}

.lists{
  display:grid;grid-template-columns:1fr 1fr;border:2px solid #666;
  min-height:370px;background:#f4f4f4
}
.col{padding:12px 9px;min-width:0}
.col+.col{border-left:2px solid #666}
.col h2{text-align:center;font-size:28px;font-weight:400;margin:150px 0 18px}
ul{list-style:none;padding:0;margin:0}
.file{padding:8px 2px;border-top:1px solid #aaa;font-size:13px}
.file:first-child{border-top:0}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:#d2d2d2;border-radius:20px;overflow:hidden;margin:5px 0}
.bar span{display:block;width:0;height:100%;background:#222}
.meta{font-size:11px;color:#666}
#status{margin-top:9px;font-size:11px;line-height:1.5;color:#666;word-break:break-all}

@media(max-width:520px){
  header .title{font-size:23px}
  main{padding:16px 14px}
  .pair{margin:12px 24px;gap:22px}
  .placeholder{font-size:25px}
  button{font-size:23px;min-height:58px}
  .lists{min-height:350px}
  .col h2{font-size:24px;margin-top:145px}
}
</style>
</head>

<body>
<header>
  <div class="title">WebRTC傳輸工具</div>
  <div class="lights">
    <span id="light1" class="light"></span>
    <span id="light2" class="light"></span>
  </div>
</header>

<main>
  <button id="connectBtn">連線QR收合</button>

  <section id="pair" class="pair">
    <div class="box">
      <div id="qrPlaceholder" class="placeholder">QR碼</div>
      <img id="qrImg" alt="WebRTC QR">
      <div id="qrBadge" class="badge hidden">建立中</div>
    </div>

    <div class="box" id="cameraBox">
      <div id="camPlaceholder" class="placeholder">相機</div>
      <video id="cam" playsinline autoplay muted></video>
      <div id="scanBadge" class="badge hidden">點一下相機啟動</div>
    </div>
  </section>

  <button id="addBtn" disabled>新增傳輸檔案鍵</button>
  <input id="fileInput" type="file" multiple>

  <section class="lists">
    <div class="col">
      <h2>傳送列表</h2>
      <ul id="sendList"></ul>
    </div>
    <div class="col">
      <h2>接收列表</h2>
      <ul id="recvList"></ul>
    </div>
  </section>

  <div id="status">初始化…</div>
</main>

<script>
(() => {
'use strict';

const $=s=>document.querySelector(s);
const enc=new TextEncoder();
const dec=new TextDecoder();

const QR_HZ=30;
const QR_PART=240;
const FILE_PART=32*1024;
const devId=randomHex(8);

let qrFrames=[];
let qrPos=0;
let qrTimer=null;
let stream=null;
let scanRAF=null;
let scanBusy=false;
let detector=null;
let flashed=false;
let pairCollapsed=false;

const rxSignal=new Map();

const lanes={
  1:{id:1,offerPc:null,offerDc:null,answerPc:null,answerDc:null,offerFrames:[],answerFrames:[],mode:'OFFER',connected:false},
  2:{id:2,offerPc:null,offerDc:null,answerPc:null,answerDc:null,offerFrames:[],answerFrames:[],mode:'OFFER',connected:false}
};

const cv=document.createElement('canvas');
const cx=cv.getContext('2d',{willReadFrequently:true});

function randomHex(n){
  const a=new Uint8Array(n);crypto.getRandomValues(a);
  return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function setStatus(s){$('#status').textContent=s}
function flash(){
  if(flashed)return;
  flashed=true;
  document.body.classList.remove('flash');
  void document.body.offsetWidth;
  document.body.classList.add('flash');
  setTimeout(()=>document.body.classList.remove('flash'),520);
}
function connected(id){
  if(lanes[id].connected)return;
  lanes[id].connected=true;
  $('#light'+id).classList.add('ok');
  $('#addBtn').disabled=false;
  flash();
  setStatus(`WebRTC ${id} 已連線`);
}

function qrData(text){
  if(typeof window.qrcode!=='function'){
    throw new Error('QR library 未載入');
  }
  const q=window.qrcode(0,'L');
  q.addData(text,'Byte');
  q.make();
  return q.createDataURL(4,2);
}

function showImmediateQr(){
  try{
    const boot={
      app:'WQ3',v:3,type:'BOOT',from:devId,
      text:'WebRTC QR 初始化'
    };
    $('#qrImg').src=qrData(JSON.stringify(boot));
    $('#qrImg').style.display='block';
    $('#qrPlaceholder').style.display='none';
    $('#qrBadge').classList.remove('hidden');
    $('#qrBadge').textContent='QR正常 · 正在建立Offer';
    setStatus('QR 產生器正常，正在建立 WebRTC Offer…');
  }catch(e){
    $('#qrBadge').classList.remove('hidden');
    $('#qrBadge').textContent='QR產生器載入失敗';
    setStatus('QR library 錯誤：'+e.message);
  }
}

function rebuildFramePool(){
  qrFrames=[];
  for(const id of [1,2]){
    const lane=lanes[id];
    const source=
      lane.mode==='ANSWER' && lane.answerFrames.length
      ? lane.answerFrames
      : lane.offerFrames;
    qrFrames.push(...source);
  }
  qrPos=0;
}

function startQrLoop(){
  if(qrTimer)return;
  qrTimer=setInterval(()=>{
    if(!qrFrames.length)return;
    const f=qrFrames[qrPos++ % qrFrames.length];
    $('#qrImg').src=f.url;
    $('#qrBadge').textContent=`${f.type} · 連線${f.lane} · ${f.i+1}/${f.n} · 30Hz`;
  },1000/QR_HZ);
}

function makePc(laneId,kind){
  const pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'}]
  });

  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected')connected(laneId);
  };
  pc.oniceconnectionstatechange=()=>{
    if(pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed')connected(laneId);
  };
  pc.ondatachannel=e=>{
    attachDc(laneId,e.channel);
    if(kind==='answer')lanes[laneId].answerDc=e.channel;
  };
  return pc;
}

function attachDc(laneId,dc){
  dc.binaryType='arraybuffer';
  let rx=null;

  dc.onopen=()=>connected(laneId);

  dc.onmessage=e=>{
    if(typeof e.data==='string'){
      let m;
      try{m=JSON.parse(e.data)}catch{return}
      if(m.t==='meta'){
        rx={
          id:m.id,name:m.name,size:m.size,type:m.type||'application/octet-stream',
          parts:[],bytes:0,row:addRow($('#recvList'),m.name,m.size)
        };
      }else if(m.t==='done'&&rx&&m.id===rx.id){
        const blob=new Blob(rx.parts,{type:rx.type});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=rx.name;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),3000);
        setRow(rx.row,100,`完成 · ${fmt(rx.size)}`);
        rx=null;
      }
      return;
    }

    if(rx){
      rx.parts.push(e.data);
      rx.bytes+=e.data.byteLength;
      setRow(rx.row,rx.size?rx.bytes*100/rx.size:0,`${fmt(rx.bytes)} / ${fmt(rx.size)}`);
    }
  };
}

async function waitIce(pc,maxMs=3500){
  if(pc.iceGatheringState==='complete')return;
  await new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      pc.removeEventListener('icegatheringstatechange',onchange);
      resolve();
    };
    const onchange=()=>{
      if(pc.iceGatheringState==='complete')finish();
    };
    const timer=setTimeout(finish,maxMs);
    pc.addEventListener('icegatheringstatechange',onchange);
  });
}

async function createOffer(id){
  const lane=lanes[id];
  const pc=makePc(id,'offer');
  lane.offerPc=pc;

  const dc=pc.createDataChannel('file-'+id,{ordered:true});
  lane.offerDc=dc;
  attachDc(id,dc);

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  // 不再無限等 ICE；最多 3.5 秒就先把目前 SDP 做成 QR。
  await waitIce(pc,3500);

  lane.offerFrames=await makeSignalFrames('OFFER',id,null,pc.localDescription.sdp);
  rebuildFramePool();
  startQrLoop();

  setStatus(`Offer ${id} QR 已生成：${lane.offerFrames.length} 張`);
}

async function makeSignalFrames(type,lane,target,sdp){
  const packed=await compress(sdp);
  const sid=randomHex(5);
  const chunks=[];

  for(let p=0;p<packed.data.length;p+=QR_PART){
    chunks.push(packed.data.slice(p,p+QR_PART));
  }

  return chunks.map((d,i)=>{
    const obj={
      app:'WQ3',v:3,from:devId,target,
      type,lane,sid,z:packed.z,i,n:chunks.length,d
    };
    return {...obj,url:qrData(JSON.stringify(obj))};
  });
}

async function compress(text){
  const bytes=enc.encode(text);
  if('CompressionStream'in window){
    try{
      const cs=new CompressionStream('deflate');
      const w=cs.writable.getWriter();
      await w.write(bytes);await w.close();
      const a=new Uint8Array(await new Response(cs.readable).arrayBuffer());
      return {z:1,data:b64(a)};
    }catch{}
  }
  return {z:0,data:b64(bytes)};
}

async function uncompress(z,s){
  const bytes=unb64(s);
  if(z&&'DecompressionStream'in window){
    const ds=new DecompressionStream('deflate');
    const w=ds.writable.getWriter();
    await w.write(bytes);await w.close();
    return await new Response(ds.readable).text();
  }
  return dec.decode(bytes);
}

function b64(a){
  let s='';
  for(let i=0;i<a.length;i+=8192){
    s+=String.fromCharCode(...a.subarray(i,i+8192));
  }
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const x=atob(s),a=new Uint8Array(x.length);
  for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
  return a;
}

async function createAnswer(laneId,remote,sdp){
  const lane=lanes[laneId];
  if(lane.answerPc)return;

  const pc=makePc(laneId,'answer');
  lane.answerPc=pc;

  await pc.setRemoteDescription({type:'offer',sdp});
  const ans=await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await waitIce(pc,3500);

  lane.answerFrames=await makeSignalFrames(
    'ANSWER',laneId,remote,pc.localDescription.sdp
  );

  // 掃完 Offer 後，該條本機 QR 立即切換成 Answer。
  lane.mode='ANSWER';
  rebuildFramePool();

  setStatus(`Offer ${laneId} 掃描完成 → QR 已切換 Answer`);
}

async function applyAnswer(laneId,sdp){
  const lane=lanes[laneId];
  if(!lane.offerPc||lane.offerPc.currentRemoteDescription)return;

  try{
    await lane.offerPc.setRemoteDescription({type:'answer',sdp});
    setStatus(`Answer ${laneId} 已套用，等待 WebRTC`);
  }catch(e){
    setStatus(`Answer ${laneId} 錯誤：${e.message}`);
  }
}

async function receivePacket(raw){
  let p;
  try{p=JSON.parse(raw)}catch{return}

  if(
    p.app!=='WQ3'||p.v!==3||
    p.type==='BOOT'||p.from===devId||
    (p.target&&p.target!==devId)||
    !lanes[p.lane]
  )return;

  const key=[p.from,p.type,p.lane,p.sid].join('|');
  let box=rxSignal.get(key);

  if(!box){
    box={p,n:p.n,z:p.z,count:0,parts:new Array(p.n),done:false};
    rxSignal.set(key,box);
  }

  if(!box.parts[p.i]){
    box.parts[p.i]=p.d;
    box.count++;
  }

  $('#scanBadge').textContent=
    `${p.type} · 連線${p.lane} · ${box.count}/${box.n}`;

  if(box.done||box.count!==box.n)return;
  for(let i=0;i<box.n;i++)if(typeof box.parts[i]!=='string')return;

  box.done=true;
  const sdp=await uncompress(box.z,box.parts.join(''));

  if(p.type==='OFFER'){
    $('#scanBadge').textContent=`Offer ${p.lane} 完整 → Answer`;
    await createAnswer(p.lane,p.from,sdp);
  }else if(p.type==='ANSWER'){
    $('#scanBadge').textContent=`Answer ${p.lane} 完整`;
    await applyAnswer(p.lane,sdp);
  }
}

async function startCamera(){
  if(stream)return;

  if(!window.isSecureContext){
    alert('相機需要 HTTPS');
    return;
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    $('#cam').srcObject=stream;
    await $('#cam').play();
    $('#cam').style.display='block';
    $('#camPlaceholder').style.display='none';
    $('#scanBadge').classList.remove('hidden');
    $('#scanBadge').textContent='掃描中';

    if('BarcodeDetector'in window){
      detector=new BarcodeDetector({formats:['qr_code']});
      scanRAF=requestAnimationFrame(scan);
    }else{
      $('#scanBadge').textContent='此瀏覽器沒有 BarcodeDetector';
      setStatus('QR 已正常生成；但此瀏覽器沒有 BarcodeDetector，無法自動掃描');
    }
  }catch(e){
    setStatus('相機啟動失敗：'+e.message);
  }
}

async function scan(now){
  scanRAF=requestAnimationFrame(scan);
  if(scanBusy)return;
  if(!scan.last)scan.last=0;
  if(now-scan.last<66)return;
  scan.last=now;

  const v=$('#cam');
  if(v.readyState<2||!v.videoWidth)return;

  scanBusy=true;
  try{
    const scale=Math.min(1,720/v.videoWidth);
    cv.width=Math.round(v.videoWidth*scale);
    cv.height=Math.round(v.videoHeight*scale);
    cx.drawImage(v,0,0,cv.width,cv.height);

    const found=await detector.detect(cv);
    if(found.length&&found[0].rawValue){
      await receivePacket(found[0].rawValue);
    }
  }catch{}
  finally{scanBusy=false}
}

function bestDc(){
  for(const id of [1,2]){
    for(const dc of [lanes[id].offerDc,lanes[id].answerDc]){
      if(dc?.readyState==='open')return dc;
    }
  }
  return null;
}

function fmt(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
function addRow(parent,name,size){
  const li=document.createElement('li');
  li.className='file';

  const n=document.createElement('div');
  n.className='name';n.textContent=name;

  const b=document.createElement('div');
  b.className='bar';
  const fill=document.createElement('span');
  b.appendChild(fill);

  const m=document.createElement('div');
  m.className='meta';m.textContent=fmt(size);

  li.append(n,b,m);parent.appendChild(li);
  return li;
}
function setRow(row,pct,text){
  row.querySelector('.bar span').style.width=
    Math.max(0,Math.min(100,pct))+'%';
  row.querySelector('.meta').textContent=text;
}

async function sendFiles(files){
  for(const file of files){
    const dc=bestDc();
    if(!dc){
      alert('WebRTC 尚未連線');
      return;
    }

    const id=randomHex(6);
    const row=addRow($('#sendList'),file.name,file.size);

    dc.send(JSON.stringify({
      t:'meta',id,name:file.name,size:file.size,type:file.type
    }));

    let pos=0;
    while(pos<file.size){
      while(dc.bufferedAmount>4*1024*1024){
        await new Promise(r=>setTimeout(r,10));
      }
      const end=Math.min(file.size,pos+FILE_PART);
      dc.send(await file.slice(pos,end).arrayBuffer());
      pos=end;
      setRow(row,file.size?pos*100/file.size:100,`${fmt(pos)} / ${fmt(file.size)}`);
    }

    dc.send(JSON.stringify({t:'done',id}));
    setRow(row,100,`完成 · ${fmt(file.size)}`);
  }
}

$('#connectBtn').addEventListener('click',()=>{
  pairCollapsed=!pairCollapsed;
  $('#pair').classList.toggle('hidden',pairCollapsed);
  $('#connectBtn').textContent=pairCollapsed?'連線QR展開':'連線QR收合';
});

$('#cameraBox').addEventListener('click',startCamera);

$('#addBtn').addEventListener('click',()=>$('#fileInput').click());

$('#fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];
  e.target.value='';
  if(files.length)await sendFiles(files);
});

window.addEventListener('beforeunload',()=>{
  if(qrTimer)clearInterval(qrTimer);
  if(scanRAF)cancelAnimationFrame(scanRAF);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  for(const id of [1,2]){
    try{lanes[id].offerPc?.close()}catch{}
    try{lanes[id].answerPc?.close()}catch{}
  }
});

/* ===== 初始化：不等使用者、不等相機，先產生 QR ===== */
async function init(){
  // 等外部 QR library 一小段時間，避免 defer/cache 時序問題
  for(let i=0;i<30 && typeof window.qrcode!=='function';i++){
    await new Promise(r=>setTimeout(r,100));
  }

  showImmediateQr();

  // 兩條 Offer 平行建立。任一條先完成就先開始輪播。
  Promise.allSettled([
    createOffer(1),
    createOffer(2)
  ]).then(results=>{
    const bad=results.filter(x=>x.status==='rejected');
    if(bad.length){
      setStatus(
        'QR 已產生；部分 Offer 建立失敗：'+
        bad.map(x=>x.reason?.message||String(x.reason)).join(' / ')
      );
    }else{
      setStatus('兩條 Offer QR 已生成。點右側「相機」啟動前鏡頭互掃。');
    }
  });
}

init();
})();
</script>
</body>
</html>
