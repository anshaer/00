<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebRTC傳輸工具</title>
<style>
:root{
  --bg:#eeeeee;--top:#050505;--text:#050505;--line:#696969;
  --green:#11ee37;--white:#fff;--muted:#666;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans TC",sans-serif}
body.flash::before{
  content:"";position:fixed;inset:0;background:rgba(0,255,64,.52);
  pointer-events:none;z-index:9999;animation:okflash .5s linear 1;
}
@keyframes okflash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
header{
  height:78px;background:var(--top);color:#fff;display:flex;align-items:center;
  padding:0 15px;border-bottom:2px solid #999;
}
header h1{font-size:29px;font-weight:500;margin:0;white-space:nowrap}
.lights{margin-left:auto;display:flex;gap:18px;align-items:center}
.light{
  width:23px;height:23px;border-radius:50%;background:#777;border:1px solid #333;
}
.light.on{background:var(--green);box-shadow:0 0 8px rgba(0,255,40,.35)}
main{padding:22px 23px 18px;max-width:760px;margin:auto}
button{
  border:2px solid var(--line);background:#f3f3f3;color:#000;border-radius:12px;
  min-height:62px;font-size:28px;padding:8px 15px;cursor:pointer;
}
button:active{background:#ddd}
button:disabled{opacity:.45;cursor:not-allowed}
.full{width:100%}
.pair{
  display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:12px 46px;
}
.square{
  position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-radius:37px;
  background:#f3f3f3;overflow:hidden;min-width:0;
}
.square .label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:29px;z-index:3;pointer-events:none;background:rgba(243,243,243,.0)
}
#qrCanvas{width:100%;height:100%;display:block;background:#fff}
#camera{
  width:100%;height:100%;display:block;object-fit:cover;background:#111;transform:scaleX(-1)
}
#qrBox.active .label,#camBox.active .label{display:none}
.qrtype{
  position:absolute;left:6px;right:6px;bottom:7px;z-index:4;text-align:center;
  font-size:13px;font-weight:700;background:rgba(255,255,255,.88);border-radius:7px;padding:3px 5px;
}
.camstate{
  position:absolute;left:6px;right:6px;bottom:7px;z-index:4;text-align:center;
  font-size:12px;background:rgba(0,0,0,.75);color:#fff;border-radius:7px;padding:4px;
}
.add{margin:12px 0}
.transfer{
  display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);
  min-height:370px;background:#f3f3f3
}
.column{min-width:0;padding:14px 10px}
.column+ .column{border-left:2px solid var(--line)}
.column h2{
  font-size:28px;font-weight:500;text-align:center;margin:150px 0 18px
}
.list{margin:0;padding:0;list-style:none;font-size:14px}
.item{
  border-top:1px solid #aaa;padding:8px 4px;display:grid;gap:5px
}
.item:first-child{border-top:0}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:6px;background:#ddd;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#222}
.meta{font-size:11px;color:#666}
#fileInput{display:none}
.debug{
  margin-top:10px;font-size:11px;color:#666;line-height:1.45;word-break:break-all
}
@media(max-width:480px){
 header h1{font-size:23px}
 main{padding:16px 14px}
 .pair{margin:12px 24px;gap:22px}
 button{font-size:23px;min-height:58px}
 .square .label{font-size:25px}
 .transfer{min-height:350px}
 .column h2{font-size:24px;margin-top:145px}
}
</style>
</head>
<body>
<header>
  <h1>WebRTC傳輸工具</h1>
  <div class="lights">
    <span id="lightA" class="light" title="WebRTC A"></span>
    <span id="lightB" class="light" title="WebRTC B"></span>
  </div>
</header>

<main>
  <button id="startBtn" class="full">連線QR收合</button>

  <div class="pair" id="pairArea">
    <div class="square" id="qrBox">
      <canvas id="qrCanvas"></canvas>
      <div class="label">QR碼</div>
      <div id="qrType" class="qrtype" hidden>建立中</div>
    </div>

    <div class="square" id="camBox">
      <video id="camera" playsinline muted></video>
      <div class="label">相機</div>
      <div id="camState" class="camstate" hidden>待機</div>
    </div>
  </div>

  <div class="add">
    <button id="addBtn" class="full" disabled>新增傳輸檔案鍵</button>
    <input id="fileInput" type="file" multiple>
  </div>

  <section class="transfer">
    <div class="column">
      <h2>傳送列表</h2>
      <ul id="sendList" class="list"></ul>
    </div>
    <div class="column">
      <h2>接收列表</h2>
      <ul id="recvList" class="list"></ul>
    </div>
  </section>

  <div id="debug" class="debug">未啟動</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const enc = new TextEncoder();
const dec = new TextDecoder();

const QR_FPS = 30;
const QR_PART = 520;
const FILE_CHUNK = 32 * 1024;
const ICE_TIMEOUT = 8000;

const deviceId = randomHex(8);
const bootId = randomHex(5);

let started = false;
let qrTimer = 0;
let scanTimer = 0;
let stream = null;
let videoCanvas = document.createElement('canvas');
let videoCtx = videoCanvas.getContext('2d', {willReadFrequently:true});

const links = new Map();
const incomingSignals = new Map();
const outgoingPackets = [];
let qrCursor = 0;
let connectedOnce = false;

function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function randomHex(n){return [...rand(n)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function log(s){ $('#debug').textContent = s; }

function flashGreen(){
  if(connectedOnce) return;
  connectedOnce = true;
  document.body.classList.remove('flash');
  void document.body.offsetWidth;
  document.body.classList.add('flash');
  setTimeout(()=>document.body.classList.remove('flash'),520);
}

function linkLight(id,on){
  const el = id==='A' ? $('#lightA') : $('#lightB');
  el.classList.toggle('on', !!on);
  if(on) flashGreen();
}

function makeLink(id){
  const pc = new RTCPeerConnection({iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'}
  ]});
  const link = {id, pc, dc:null, localType:null, localSdp:null, remoteSet:false, open:false};
  links.set(id,link);

  pc.onconnectionstatechange=()=>{
    log(`${id} ${pc.connectionState}`);
    if(pc.connectionState==='connected') linkLight(id,true);
    if(['failed','closed','disconnected'].includes(pc.connectionState) && !link.open) linkLight(id,false);
  };
  pc.ondatachannel=e=>attachDC(link,e.channel);
  return link;
}

function attachDC(link,dc){
  link.dc=dc; dc.binaryType='arraybuffer';
  let rx=null;

  dc.onopen=()=>{
    link.open=true;linkLight(link.id,true);
    $('#addBtn').disabled=false;
    log(`WebRTC ${link.id} DataChannel OPEN`);
  };
  dc.onclose=()=>{link.open=false; if(![...links.values()].some(x=>x.open&&x.id===link.id)) linkLight(link.id,false)};
  dc.onerror=()=>log(`WebRTC ${link.id} DataChannel ERROR`);

  dc.onmessage=e=>{
    if(typeof e.data==='string'){
      let m; try{m=JSON.parse(e.data)}catch{return}
      if(m.t==='meta'){
        rx={id:m.id,name:m.name,size:m.size,type:m.type||'',parts:[],bytes:0,row:addRecvRow(m.name,m.size)};
      }else if(m.t==='done' && rx && m.id===rx.id){
        const blob=new Blob(rx.parts,{type:rx.type||'application/octet-stream'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);a.download=rx.name;a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),3000);
        setRow(rx.row,100,`完成 · ${fmt(rx.size)}`);
        rx=null;
      }
      return;
    }
    if(rx){
      rx.parts.push(e.data);rx.bytes+=e.data.byteLength;
      setRow(rx.row,rx.size?rx.bytes*100/rx.size:0,`${fmt(rx.bytes)} / ${fmt(rx.size)}`);
    }
  };
}

function waitIce(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState==='complete') return resolve();
    const t=setTimeout(()=>{pc.removeEventListener('icegatheringstatechange',f);resolve()},ICE_TIMEOUT);
    const f=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);pc.removeEventListener('icegatheringstatechange',f);resolve()}};
    pc.addEventListener('icegatheringstatechange',f);
  });
}

async function createOurOffer(id){
  const link=makeLink(id);
  const dc=link.pc.createDataChannel('file-'+id,{ordered:true});
  attachDC(link,dc);
  const offer=await link.pc.createOffer();
  await link.pc.setLocalDescription(offer);
  await waitIce(link.pc);
  link.localType='offer'; link.localSdp=link.pc.localDescription.sdp;
  await enqueueSignal(id,'OFFER',link.localSdp);
}

async function answerRemoteOffer(remoteLinkId, sdp, remoteDevice){
  // Remote A is answered by our B, remote B by our A.
  const localId = remoteLinkId==='A' ? 'B' : 'A';
  let link=links.get(localId);

  // If this local link already has its own offer, keep it for the first connection
  // and create a dedicated answer lane with matching remote ID namespace.
  const answerId='R'+remoteLinkId+'-'+remoteDevice.slice(0,4);
  link=makeLink(answerId);

  await link.pc.setRemoteDescription({type:'offer',sdp});
  const answer=await link.pc.createAnswer();
  await link.pc.setLocalDescription(answer);
  await waitIce(link.pc);
  link.localType='answer';link.localSdp=link.pc.localDescription.sdp;
  link.answerFor={remoteDevice,remoteLinkId};
  await enqueueSignal(remoteLinkId,'ANSWER',link.localSdp,remoteDevice,answerId);
}

async function applyRemoteAnswer(pkt,sdp){
  // Answer tells us which original offer lane it answers.
  const link=links.get(pkt.lane);
  if(!link || link.remoteSet) return;
  try{
    await link.pc.setRemoteDescription({type:'answer',sdp});
    link.remoteSet=true;
    log(`Answer 套用：${pkt.lane}`);
  }catch(e){log(`Answer 套用失敗 ${pkt.lane}: ${e.message}`)}
}

async function compressText(text){
  if(!('CompressionStream' in window)) return {z:0,d:b64(enc.encode(text))};
  const cs=new CompressionStream('deflate');
  const w=cs.writable.getWriter();
  w.write(enc.encode(text));w.close();
  const ab=await new Response(cs.readable).arrayBuffer();
  return {z:1,d:b64(new Uint8Array(ab))};
}
async function decompressText(z,data){
  const bytes=unb64(data);
  if(!z) return dec.decode(bytes);
  const ds=new DecompressionStream('deflate');
  const w=ds.writable.getWriter();w.write(bytes);w.close();
  return await new Response(ds.readable).text();
}
function b64(bytes){
  let s=''; for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;
}

async function enqueueSignal(lane,type,sdp,target=null,answerId=null){
  const packed=await compressText(sdp);
  const signalId=randomHex(5);
  const pieces=[];
  for(let i=0;i<packed.d.length;i+=QR_PART) pieces.push(packed.d.slice(i,i+QR_PART));
  pieces.forEach((piece,index)=>{
    outgoingPackets.push({
      v:2,app:'WRTQ',from:deviceId,boot:bootId,target,
      sid:signalId,lane,type,z:packed.z,i:index,n:pieces.length,d:piece,
      aid:answerId||null
    });
  });
  log(`${type} ${lane}: ${pieces.length} QR`);
}

function isForUs(p){
  return !p.target || p.target===deviceId;
}
async function receivePacket(p){
  if(!p || p.v!==2 || p.app!=='WRTQ' || p.from===deviceId || !isForUs(p)) return;

  const key=[p.from,p.sid,p.type,p.lane].join('|');
  let box=incomingSignals.get(key);
  if(!box){
    box={n:p.n,z:p.z,parts:new Array(p.n),count:0,p};
    incomingSignals.set(key,box);
  }
  if(!box.parts[p.i]){
    box.parts[p.i]=p.d;box.count++;
    $('#camState').textContent=`${p.type} ${box.count}/${box.n}`;
  }
  if(box.count===box.n && !box.done){
    box.done=true;
    const text=await decompressText(box.z,box.parts.join(''));
    if(p.type==='OFFER'){
      $('#camState').textContent=`Offer完成 → Answer`;
      await answerRemoteOffer(p.lane,text,p.from);
    }else if(p.type==='ANSWER'){
      $('#camState').textContent=`Answer完成`;
      await applyRemoteAnswer(p,text);
    }
  }
}

async function drawNextQR(){
  if(!started || !outgoingPackets.length || !window.QRCode) return;
  // Prefer ANSWER packets after any are available, while still cycling offers.
  const answers=outgoingPackets.filter(x=>x.type==='ANSWER');
  const offers=outgoingPackets.filter(x=>x.type==='OFFER');
  let pool = answers.length ? answers.concat(offers.slice(0,Math.max(1,Math.ceil(offers.length/4)))) : offers;
  if(!pool.length) return;
  const p=pool[qrCursor++ % pool.length];
  const txt=JSON.stringify(p);
  try{
    await QRCode.toCanvas($('#qrCanvas'),txt,{
      errorCorrectionLevel:'L',margin:1,width:420,
      color:{dark:'#000000',light:'#ffffff'}
    });
    $('#qrBox').classList.add('active');
    $('#qrType').hidden=false;
    $('#qrType').textContent=`${p.type} ${p.lane} · ${p.i+1}/${p.n} · 30Hz`;
  }catch(e){log('QR生成失敗：'+e.message)}
}

async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
    audio:false
  });
  const v=$('#camera');v.srcObject=stream;await v.play();
  $('#camBox').classList.add('active');$('#camState').hidden=false;$('#camState').textContent='掃描中';
}

async function scanFrame(){
  if(!started) return;
  const v=$('#camera');
  if(v.readyState<2) return;
  const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return;
  const max=720,scale=Math.min(1,max/w);
  videoCanvas.width=Math.max(1,Math.round(w*scale));
  videoCanvas.height=Math.max(1,Math.round(h*scale));
  videoCtx.drawImage(v,0,0,videoCanvas.width,videoCanvas.height);

  try{
    let raw=null;
    if('BarcodeDetector' in window){
      if(!scanFrame.detector) scanFrame.detector=new BarcodeDetector({formats:['qr_code']});
      const list=await scanFrame.detector.detect(videoCanvas);
      if(list.length) raw=list[0].rawValue;
    }else if(window.jsQR){
      const img=videoCtx.getImageData(0,0,videoCanvas.width,videoCanvas.height);
      const qr=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
      if(qr) raw=qr.data;
    }
    if(raw){
      let p;try{p=JSON.parse(raw)}catch{return}
      await receivePacket(p);
    }
  }catch(e){}
}

async function start(){
  if(started){
    $('#pairArea').hidden=!$('#pairArea').hidden;
    $('#startBtn').textContent=$('#pairArea').hidden?'展開連線QR':'連線QR收合';
    return;
  }
  if(!window.isSecureContext){
    alert('相機需要 HTTPS 網址，不能直接用 file:// 開啟。');
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    alert('此瀏覽器不能使用相機。');return;
  }
  started=true;
  $('#startBtn').textContent='連線QR收合';
  log('建立雙 WebRTC Offer…');
  try{
    await startCamera();
    await Promise.all([createOurOffer('A'),createOurOffer('B')]);
    qrTimer=setInterval(drawNextQR,1000/QR_FPS);
    scanTimer=setInterval(scanFrame,90); // camera decoding does not need 30 decode attempts/s
    drawNextQR();
  }catch(e){
    started=false;log('啟動失敗：'+e.message);alert('啟動失敗：'+e.message);
  }
}

function primaryDC(){
  const open=[...links.values()].filter(x=>x.dc&&x.dc.readyState==='open');
  return open[0]?.dc||null;
}
function fmt(n){
  if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';
}
function addSendRow(name,size){
  const li=document.createElement('li');li.className='item';
  li.innerHTML=`<div class="name"></div><div class="progress"><i></i></div><div class="meta"></div>`;
  li.querySelector('.name').textContent=name;li.querySelector('.meta').textContent=fmt(size);
  $('#sendList').appendChild(li);return li;
}
function addRecvRow(name,size){
  const li=document.createElement('li');li.className='item';
  li.innerHTML=`<div class="name"></div><div class="progress"><i></i></div><div class="meta"></div>`;
  li.querySelector('.name').textContent=name;li.querySelector('.meta').textContent=`0 / ${fmt(size)}`;
  $('#recvList').appendChild(li);return li;
}
function setRow(row,pct,text){
  row.querySelector('i').style.width=Math.max(0,Math.min(100,pct))+'%';
  row.querySelector('.meta').textContent=text;
}

async function sendFiles(files){
  for(const file of files){
    const dc=primaryDC();
    if(!dc){alert('目前沒有可用的 WebRTC DataChannel');return}
    const id=randomHex(6),row=addSendRow(file.name,file.size);
    dc.send(JSON.stringify({t:'meta',id,name:file.name,size:file.size,type:file.type}));
    let pos=0;
    while(pos<file.size){
      while(dc.bufferedAmount>3*1024*1024) await new Promise(r=>setTimeout(r,10));
      const end=Math.min(file.size,pos+FILE_CHUNK);
      dc.send(await file.slice(pos,end).arrayBuffer());
      pos=end;setRow(row,pos*100/file.size,`${fmt(pos)} / ${fmt(file.size)}`);
    }
    dc.send(JSON.stringify({t:'done',id}));
    setRow(row,100,`完成 · ${fmt(file.size)}`);
  }
}

$('#startBtn').addEventListener('click',start);
$('#addBtn').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  if(files.length) await sendFiles(files);
});

window.addEventListener('beforeunload',()=>{
  clearInterval(qrTimer);clearInterval(scanTimer);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  links.forEach(x=>x.pc.close());
});
})();
</script>
</body>
</html>
