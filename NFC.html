<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebRTC傳輸工具</title>

<!-- QR 產生器：只用來在瀏覽器內把 SDP 分片畫成 QR，不是 signaling 伺服器 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#efefef;--panel:#f6f6f6;--line:#666;--text:#050505;
  --ok:#15ee35;--wait:#777;--blue:#1268e8
}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif
}
body.connected-flash::after{
  content:"";position:fixed;inset:0;z-index:99999;pointer-events:none;
  background:rgba(0,255,55,.58);animation:connectedFlash .5s linear 1
}
@keyframes connectedFlash{
  0%{opacity:0}12%{opacity:1}82%{opacity:.75}100%{opacity:0}
}
.top{
  height:77px;background:#050505;color:#fff;border-bottom:2px solid #999;
  display:flex;align-items:center;padding:0 15px
}
.title{font-size:29px;font-weight:400;white-space:nowrap}
.dots{margin-left:auto;display:flex;gap:18px}
.dot{
  width:23px;height:23px;border-radius:50%;background:#777;
  border:1px solid #333
}
.dot.ok{background:var(--ok);box-shadow:0 0 9px rgba(0,255,50,.5)}

main{max-width:720px;margin:auto;padding:22px 23px 18px}
button{
  width:100%;border:2px solid var(--line);border-radius:12px;
  background:#f4f4f4;color:#000;min-height:63px;
  font-size:28px;padding:8px 12px;cursor:pointer
}
button:active{background:#ddd}
button:disabled{opacity:.45}

.connect-wrap{margin-bottom:12px}
.pair{
  display:grid;grid-template-columns:1fr 1fr;gap:28px;
  margin:12px 46px
}
.box{
  aspect-ratio:1/1;border:2px solid var(--line);border-radius:37px;
  position:relative;overflow:hidden;background:#f4f4f4;min-width:0
}
.placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:29px;z-index:1
}
#qrImage,#camera{
  position:absolute;inset:0;width:100%;height:100%;display:none
}
#qrImage{object-fit:contain;background:white;padding:4px}
#camera{object-fit:cover;background:#111;transform:scaleX(-1)}
.overlay{
  position:absolute;left:7px;right:7px;bottom:7px;z-index:5;
  border-radius:8px;padding:4px 6px;text-align:center;font-size:12px;
  background:rgba(255,255,255,.90)
}
#scanOverlay{background:rgba(0,0,0,.76);color:#fff}
.add{margin:12px 0}
#fileInput{display:none}

.lists{
  display:grid;grid-template-columns:1fr 1fr;
  min-height:370px;border:2px solid var(--line);background:#f4f4f4
}
.col{min-width:0;padding:12px 9px}
.col+.col{border-left:2px solid var(--line)}
.col h2{
  margin:150px 0 18px;text-align:center;font-size:28px;font-weight:400
}
ul{list-style:none;padding:0;margin:0}
.file{
  padding:8px 2px;border-top:1px solid #aaa;font-size:13px
}
.file:first-child{border-top:0}
.fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:#d3d3d3;border-radius:20px;overflow:hidden;margin:5px 0}
.bar span{display:block;width:0;height:100%;background:#222}
.meta{font-size:11px;color:#666}

.status{
  margin-top:9px;font-size:11px;line-height:1.45;color:#666;
  word-break:break-word
}
.hidden{display:none!important}

@media(max-width:520px){
  .title{font-size:23px}
  main{padding:16px 14px}
  .pair{gap:22px;margin:12px 24px}
  .placeholder{font-size:25px}
  button{font-size:23px;min-height:58px}
  .lists{min-height:350px}
  .col h2{font-size:24px;margin-top:145px}
}
</style>
</head>

<body>
<header class="top">
  <div class="title">WebRTC傳輸工具</div>
  <div class="dots" aria-label="兩條 WebRTC 連線狀態">
    <span id="dot1" class="dot"></span>
    <span id="dot2" class="dot"></span>
  </div>
</header>

<main>
  <div class="connect-wrap">
    <button id="connectBtn">連線QR收合</button>
  </div>

  <section id="pairArea" class="pair">
    <div class="box">
      <div id="qrPlaceholder" class="placeholder">QR碼</div>
      <img id="qrImage" alt="WebRTC signaling QR">
      <div id="qrOverlay" class="overlay hidden">準備中</div>
    </div>

    <div class="box">
      <div id="camPlaceholder" class="placeholder">相機</div>
      <video id="camera" playsinline muted autoplay></video>
      <div id="scanOverlay" class="overlay hidden">尚未掃描</div>
    </div>
  </section>

  <div class="add">
    <button id="addFileBtn" disabled>新增傳輸檔案鍵</button>
    <input id="fileInput" type="file" multiple>
  </div>

  <section class="lists">
    <div class="col">
      <h2>傳送列表</h2>
      <ul id="sendList"></ul>
    </div>
    <div class="col">
      <h2>接收列表</h2>
      <ul id="recvList"></ul>
    </div>
  </section>

  <div id="status" class="status">尚未啟動</div>
</main>

<script>
(() => {
'use strict';

const $ = q => document.querySelector(q);
const enc = new TextEncoder();
const dec = new TextDecoder();

const QR_HZ = 30;
const QR_INTERVAL = 1000 / QR_HZ;
const QR_CHUNK_CHARS = 260;
const FILE_CHUNK = 32 * 1024;
const deviceId = hex(8);
const sessionId = hex(6);

let started = false;
let collapsed = false;
let stream = null;
let qrTimer = null;
let scanBusy = false;
let scanRAF = null;
let lastScanAt = 0;
let flashed = false;

const lanes = {
  1: makeLane(1),
  2: makeLane(2)
};

const rxSignals = new Map();

const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d',{willReadFrequently:true});
let detector = null;

function makeLane(id){
  return {
    id,
    offerPc:null,
    offerDc:null,
    answerPc:null,
    answerDc:null,
    offerPackets:[],
    answerPackets:[],
    outputMode:'OFFER',
    qrIndex:0,
    connected:false,
    remoteDevice:null
  };
}

function hex(n){
  const a=new Uint8Array(n);
  crypto.getRandomValues(a);
  return [...a].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function status(s){
  $('#status').textContent=s;
}

function setLaneConnected(id){
  const lane=lanes[id];
  if(lane.connected) return;
  lane.connected=true;
  $('#dot'+id).classList.add('ok');
  $('#addFileBtn').disabled=false;

  if(!flashed){
    flashed=true;
    document.body.classList.remove('connected-flash');
    void document.body.offsetWidth;
    document.body.classList.add('connected-flash');
    setTimeout(()=>document.body.classList.remove('connected-flash'),520);
  }
  status(`WebRTC ${id} 已連線`);
}

function createPc(laneId, kind){
  const pc=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'}
    ],
    bundlePolicy:'max-bundle'
  });

  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected') setLaneConnected(laneId);
  };
  pc.oniceconnectionstatechange=()=>{
    if(pc.iceConnectionState==='connected' || pc.iceConnectionState==='completed'){
      setLaneConnected(laneId);
    }
  };
  pc.ondatachannel=e=>{
    attachDataChannel(laneId,e.channel);
    if(kind==='answer') lanes[laneId].answerDc=e.channel;
  };

  return pc;
}

function attachDataChannel(laneId,dc){
  dc.binaryType='arraybuffer';
  let rx=null;

  dc.onopen=()=>{
    setLaneConnected(laneId);
    status(`WebRTC ${laneId} DataChannel OPEN`);
  };

  dc.onmessage=e=>{
    if(typeof e.data==='string'){
      let m;
      try{m=JSON.parse(e.data)}catch{return}

      if(m.t==='meta'){
        rx={
          id:m.id,name:m.name,size:m.size,type:m.type||'application/octet-stream',
          bytes:0,parts:[],row:addRow($('#recvList'),m.name,m.size)
        };
      }else if(m.t==='done' && rx && m.id===rx.id){
        const blob=new Blob(rx.parts,{type:rx.type});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=rx.name;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),3000);
        setRow(rx.row,100,`完成 · ${fmt(rx.size)}`);
        rx=null;
      }
      return;
    }

    if(rx){
      rx.parts.push(e.data);
      rx.bytes+=e.data.byteLength;
      setRow(
        rx.row,
        rx.size ? rx.bytes*100/rx.size : 0,
        `${fmt(rx.bytes)} / ${fmt(rx.size)}`
      );
    }
  };
}

async function waitIce(pc){
  if(pc.iceGatheringState==='complete') return;

  await new Promise(resolve=>{
    const timeout=setTimeout(done,9000);
    function done(){
      clearTimeout(timeout);
      pc.removeEventListener('icegatheringstatechange',change);
      resolve();
    }
    function change(){
      if(pc.iceGatheringState==='complete') done();
    }
    pc.addEventListener('icegatheringstatechange',change);
  });
}

async function createOffer(laneId){
  const lane=lanes[laneId];
  const pc=createPc(laneId,'offer');
  lane.offerPc=pc;

  const dc=pc.createDataChannel('file-'+laneId,{ordered:true});
  lane.offerDc=dc;
  attachDataChannel(laneId,dc);

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIce(pc);

  lane.offerPackets=await signalToPackets({
    type:'OFFER',
    lane:laneId,
    target:null,
    sdp:pc.localDescription.sdp
  });

  status(`連線 ${laneId} Offer QR 已生成，共 ${lane.offerPackets.length} 張`);
}

async function createAnswer(laneId,remoteDevice,sdp){
  const lane=lanes[laneId];

  if(lane.answerPc){
    return;
  }

  lane.remoteDevice=remoteDevice;
  const pc=createPc(laneId,'answer');
  lane.answerPc=pc;

  await pc.setRemoteDescription({type:'offer',sdp});

  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await waitIce(pc);

  lane.answerPackets=await signalToPackets({
    type:'ANSWER',
    lane:laneId,
    target:remoteDevice,
    sdp:pc.localDescription.sdp
  });

  // 這就是使用者指定的行為：
  // 此 lane 一掃完整對方 Offer，這個 lane 的輸出立即從 Offer 改成 Answer。
  lane.outputMode='ANSWER';
  lane.qrIndex=0;

  status(`已掃完整對方 Offer ${laneId}，QR ${laneId} 已改為 Answer`);
}

async function applyAnswer(laneId,sdp){
  const lane=lanes[laneId];
  const pc=lane.offerPc;

  if(!pc || pc.currentRemoteDescription) return;

  try{
    await pc.setRemoteDescription({type:'answer',sdp});
    status(`連線 ${laneId} Answer 已套用，等待 WebRTC`);
  }catch(e){
    status(`Answer ${laneId} 套用失敗：${e.message}`);
  }
}

async function pack(text){
  const bytes=enc.encode(text);

  if('CompressionStream' in window){
    try{
      const cs=new CompressionStream('deflate');
      const writer=cs.writable.getWriter();
      await writer.write(bytes);
      await writer.close();
      const packed=new Uint8Array(await new Response(cs.readable).arrayBuffer());
      return {z:1,data:toB64(packed)};
    }catch{}
  }

  return {z:0,data:toB64(bytes)};
}

async function unpack(z,data){
  const bytes=fromB64(data);

  if(z && 'DecompressionStream' in window){
    const ds=new DecompressionStream('deflate');
    const writer=ds.writable.getWriter();
    await writer.write(bytes);
    await writer.close();
    return await new Response(ds.readable).text();
  }

  return dec.decode(bytes);
}

async function signalToPackets({type,lane,target,sdp}){
  const packed=await pack(sdp);
  const sid=hex(5);
  const chunks=[];

  for(let p=0;p<packed.data.length;p+=QR_CHUNK_CHARS){
    chunks.push(packed.data.slice(p,p+QR_CHUNK_CHARS));
  }

  const packets=chunks.map((data,i)=>({
    app:'WQ2',
    v:2,
    from:deviceId,
    session:sessionId,
    target,
    lane,
    type,
    sid,
    z:packed.z,
    i,
    n:chunks.length,
    d:data
  }));

  // 預先把每一張 QR 都生成成圖片。
  // 輪播時只切 img.src，才能真的做到 30Hz，而不是每幀重新計算 QR。
  for(const p of packets){
    p.url=makeQrDataUrl(JSON.stringify(p));
  }

  return packets;
}

function makeQrDataUrl(text){
  if(typeof window.qrcode!=='function'){
    throw new Error('QR 產生器載入失敗');
  }

  const qr=window.qrcode(0,'L');
  qr.addData(text,'Byte');
  qr.make();
  return qr.createDataURL(4,2);
}

function currentQrPool(){
  const pool=[];

  for(const id of [1,2]){
    const lane=lanes[id];
    const packets=
      lane.outputMode==='ANSWER' && lane.answerPackets.length
        ? lane.answerPackets
        : lane.offerPackets;

    for(const p of packets) pool.push(p);
  }

  return pool;
}

function tickQr(){
  const pool=currentQrPool();
  if(!pool.length) return;

  tickQr.index=(tickQr.index||0)%pool.length;
  const p=pool[tickQr.index++];
  const img=$('#qrImage');

  img.src=p.url;
  img.style.display='block';
  $('#qrPlaceholder').style.display='none';
  $('#qrOverlay').classList.remove('hidden');
  $('#qrOverlay').textContent=
    `${p.type} · 連線${p.lane} · ${p.i+1}/${p.n} · 30Hz`;
}

async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:'user',
      width:{ideal:1280},
      height:{ideal:720}
    },
    audio:false
  });

  const v=$('#camera');
  v.srcObject=stream;
  await v.play();
  v.style.display='block';
  $('#camPlaceholder').style.display='none';
  $('#scanOverlay').classList.remove('hidden');

  if('BarcodeDetector' in window){
    detector=new BarcodeDetector({formats:['qr_code']});
  }
}

async function scanLoop(now){
  scanRAF=requestAnimationFrame(scanLoop);
  if(!started || scanBusy) return;

  // QR 顯示為 30Hz；掃描運算控制在約 15Hz，避免手機 GPU/CPU 被吃滿。
  if(now-lastScanAt<66) return;
  lastScanAt=now;
  scanBusy=true;

  try{
    const v=$('#camera');
    if(v.readyState<2 || !v.videoWidth) return;

    const maxW=720;
    const scale=Math.min(1,maxW/v.videoWidth);
    scanCanvas.width=Math.max(1,Math.round(v.videoWidth*scale));
    scanCanvas.height=Math.max(1,Math.round(v.videoHeight*scale));

    // video 本身只是 CSS 鏡像；canvas 使用原始影像，避免 QR 被真的左右翻轉。
    scanCtx.drawImage(v,0,0,scanCanvas.width,scanCanvas.height);

    if(detector){
      const found=await detector.detect(scanCanvas);
      for(const code of found){
        if(code.rawValue){
          await receiveQr(code.rawValue);
          break;
        }
      }
    }else{
      $('#scanOverlay').textContent='此瀏覽器沒有 BarcodeDetector';
    }
  }catch{}
  finally{
    scanBusy=false;
  }
}

async function receiveQr(raw){
  let p;
  try{p=JSON.parse(raw)}catch{return}

  if(
    p.app!=='WQ2' ||
    p.v!==2 ||
    p.from===deviceId ||
    (p.target && p.target!==deviceId) ||
    !lanes[p.lane]
  ) return;

  const key=[p.from,p.type,p.lane,p.sid].join('|');

  let box=rxSignals.get(key);
  if(!box){
    box={
      from:p.from,type:p.type,lane:p.lane,
      sid:p.sid,z:p.z,n:p.n,
      pieces:new Array(p.n),count:0,done:false
    };
    rxSignals.set(key,box);
  }

  if(!box.pieces[p.i]){
    box.pieces[p.i]=p.d;
    box.count++;
  }

  $('#scanOverlay').textContent=
    `辨識 ${p.type} · 連線${p.lane} · ${box.count}/${box.n}`;

  if(box.done || box.count!==box.n) return;

  for(let i=0;i<box.n;i++){
    if(typeof box.pieces[i]!=='string') return;
  }

  box.done=true;
  const sdp=await unpack(box.z,box.pieces.join(''));

  if(box.type==='OFFER'){
    $('#scanOverlay').textContent=`Offer ${box.lane} 完整 → 建立 Answer`;
    await createAnswer(box.lane,box.from,sdp);
  }else{
    $('#scanOverlay').textContent=`Answer ${box.lane} 完整`;
    await applyAnswer(box.lane,sdp);
  }
}

async function start(){
  if(started){
    collapsed=!collapsed;
    $('#pairArea').classList.toggle('hidden',collapsed);
    $('#connectBtn').textContent=collapsed?'連線QR展開':'連線QR收合';
    return;
  }

  if(!window.isSecureContext){
    alert('前鏡頭需要 HTTPS。請把 HTML 放到 HTTPS 靜態網站後開啟。');
    return;
  }

  if(typeof window.qrcode!=='function'){
    alert('QR 產生器載入失敗，請確認網路能載入 jsDelivr。');
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    alert('此瀏覽器不能使用相機。');
    return;
  }

  started=true;
  $('#connectBtn').textContent='連線QR收合';
  status('啟動前鏡頭並建立兩組 Offer…');

  try{
    await startCamera();

    // 先生成第一條，第一條完成就立刻有 QR，不必等兩條都建立完。
    await createOffer(1);
    tickQr();
    qrTimer=setInterval(tickQr,QR_INTERVAL);

    await createOffer(2);

    scanRAF=requestAnimationFrame(scanLoop);
    status('兩組 Offer QR 已生成，請讓兩台手機前鏡頭互掃');
  }catch(e){
    status('啟動失敗：'+e.message);
    alert('啟動失敗：'+e.message);
  }
}

function bestDc(){
  for(const id of [1,2]){
    const lane=lanes[id];
    for(const dc of [lane.offerDc,lane.answerDc]){
      if(dc?.readyState==='open') return dc;
    }
  }
  return null;
}

function fmt(n){
  if(n<1024)return `${n} B`;
  if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;
  if(n<1024*1024*1024)return `${(n/1024/1024).toFixed(1)} MB`;
  return `${(n/1024/1024/1024).toFixed(2)} GB`;
}

function addRow(parent,name,size){
  const li=document.createElement('li');
  li.className='file';

  const nameEl=document.createElement('div');
  nameEl.className='fname';
  nameEl.textContent=name;

  const bar=document.createElement('div');
  bar.className='bar';
  const fill=document.createElement('span');
  bar.appendChild(fill);

  const meta=document.createElement('div');
  meta.className='meta';
  meta.textContent=fmt(size);

  li.append(nameEl,bar,meta);
  parent.appendChild(li);
  return li;
}

function setRow(row,pct,text){
  row.querySelector('.bar span').style.width=
    Math.max(0,Math.min(100,pct))+'%';
  row.querySelector('.meta').textContent=text;
}

async function sendFiles(files){
  for(const file of files){
    const dc=bestDc();
    if(!dc){
      alert('目前沒有已連線的 WebRTC DataChannel');
      return;
    }

    const id=hex(6);
    const row=addRow($('#sendList'),file.name,file.size);

    dc.send(JSON.stringify({
      t:'meta',id,name:file.name,size:file.size,type:file.type
    }));

    let pos=0;

    while(pos<file.size){
      while(dc.bufferedAmount>4*1024*1024){
        await new Promise(r=>setTimeout(r,10));
      }

      const end=Math.min(file.size,pos+FILE_CHUNK);
      const buf=await file.slice(pos,end).arrayBuffer();
      dc.send(buf);
      pos=end;

      setRow(
        row,
        file.size ? pos*100/file.size : 100,
        `${fmt(pos)} / ${fmt(file.size)}`
      );
    }

    dc.send(JSON.stringify({t:'done',id}));
    setRow(row,100,`完成 · ${fmt(file.size)}`);
  }
}

$('#connectBtn').addEventListener('click',start);
$('#addFileBtn').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];
  e.target.value='';
  if(files.length) await sendFiles(files);
});

window.addEventListener('beforeunload',()=>{
  if(qrTimer) clearInterval(qrTimer);
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(stream) stream.getTracks().forEach(t=>t.stop());

  for(const id of [1,2]){
    try{lanes[id].offerPc?.close()}catch{}
    try{lanes[id].answerPc?.close()}catch{}
  }
});
})();
</script>
</body>
</html>
