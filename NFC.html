<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 點對點 QR Code 快速傳檔</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; text-align: center; max-width: 600px; margin: 0 auto; }
    .box { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
    #qr-container { width: 250px; height: 250px; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: #fff; }
    #reader { width: 100%; max-width: 320px; margin: 0 auto; }
    #progress-bar { width: 0%; height: 20px; background-color: #4CAF50; transition: width 0.2s; }
    .progress-container { width: 100%; background-color: #f1f1f1; border-radius: 5px; margin-top: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h2>WebRTC 免伺服器 P2P 傳檔</h2>

  <div id="status" class="box" style="background-color: #eef;">
    連線狀態：<strong id="status-text">初始化中...</strong>
  </div>

  <div id="p2p-setup">
    <div class="box">
      <button id="btn-create-offer">點此建立連線 (Role A)</button>
      <div id="qr-section" class="hidden">
        <p id="qr-label">請對方掃描此連線 QR 碼：</p>
        <div id="qr-container"></div>
      </div>
    </div>

    <div class="box" id="scanner-box">
      <h3>掃描對方的 QR Code</h3>
      <div id="reader"></div>
    </div>
  </div>

  <div id="transfer-section" class="box hidden">
    <h3>傳送檔案</h3>
    <input type="file" id="file-input">
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <p id="progress-text">準備傳送/接收...</p>
    <div id="download-list" style="margin-top: 15px; text-align: left;"></div>
  </div>

  <script>
    // --- WebRTC 與變數定義 ---
    const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let pc = new RTCPeerConnection(configuration);
    let dataChannel = null;
    let html5QrCode = null;

    // 分頁與動畫變數 (V5 容量有限，大 SDP 自動拆封包輪播)
    let qrFrames = [];
    let qrFrameIndex = 0;
    let qrAnimationTimer = null;
    let receivedChunksMap = {}; 

    // DOM 元素
    const statusText = document.getElementById('status-text');
    const qrContainer = document.getElementById('qr-container');
    const qrSection = document.getElementById('qr-section');
    const qrLabel = document.getElementById('qr-label');
    const p2pSetup = document.getElementById('p2p-setup');
    const transferSection = document.getElementById('transfer-section');

    // --- WebRTC 事件綁定 ---
    pc.onicecandidate = (event) => {
      if (event.candidate === null) {
        // ICE 收集完成，將完整 SDP 轉成 30Hz QR 輪播
        const sdpData = JSON.stringify(pc.localDescription);
        start30HzQrStream(sdpData);
      }
    };

    pc.ondatachannel = (event) => {
      dataChannel = event.channel;
      setupDataChannel();
    };

    pc.oniceconnectionstatechange = () => {
      statusText.innerText = pc.iceConnectionState;
      if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
        onConnectionSuccess();
      }
    };

    // --- 連線成功處置 (隱藏 QR 與關閉相機) ---
    function onConnectionSuccess() {
      statusText.innerText = "已順利連線！";
      statusText.style.color = "green";
      
      // 停止 QR 輪播動畫
      if (qrAnimationTimer) clearInterval(qrAnimationTimer);
      
      // 關閉相機
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(console.error);
      }

      // 隱藏 QR 與鏡頭區域，顯示傳檔區
      p2pSetup.classList.add('hidden');
      transferSection.classList.remove('hidden');
    }

    // --- QR 碼 30Hz 輪播邏輯 (使用 Version 5) ---
    function start30HzQrStream(textData) {
      // Version 5 容納字數有限 (約 106-130 bytes)，將長文字切碎成多張圖輪播
      const chunkSize = 80;
      const total = Math.ceil(textData.length / chunkSize);
      qrFrames = [];

      for (let i = 0; i < total; i++) {
        const chunk = textData.substr(i * chunkSize, chunkSize);
        // 帶上 header: {總頁碼}|{當前頁碼}|{內容}
        qrFrames.push(`${total}|${i}|${chunk}`);
      }

      qrSection.classList.remove('hidden');
      if (qrAnimationTimer) clearInterval(qrAnimationTimer);

      // 設定 30Hz (每 33 毫秒切換一張 QR)
      qrAnimationTimer = setInterval(() => {
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: qrFrames[qrFrameIndex],
          correctLevel: QRCode.CorrectLevel.L,
          version: 5, // 強制使用 Version 5
          width: 200,
          height: 200
        });
        qrFrameIndex = (qrFrameIndex + 1) % qrFrames.length;
      }, 33);
    }

    // --- 相機掃描 (前鏡頭視角) ---
    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      // facingMode: "user" 指定前置鏡頭
      html5QrCode.start(
        { facingMode: "user" }, 
        { fps: 30, qrbox: { width: 250, height: 250 } },
        onQrCodeScanned
      ).catch(err => {
        console.warn("前鏡頭啟動失敗，改嘗試預設鏡頭", err);
        html5QrCode.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, onQrCodeScanned);
      });
    }

    // 重組輪播掃描到的資料
    function onQrCodeScanned(decodedText) {
      const parts = decodedText.split('|');
      if (parts.length < 3) return;

      const total = parseInt(parts[0]);
      const index = parseInt(parts[1]);
      const data = parts.slice(2).join('|');

      receivedChunksMap[index] = data;

      // 檢查是否已集滿所有分頁
      if (Object.keys(receivedChunksMap).length === total) {
        let fullData = "";
        for (let i = 0; i < total; i++) fullData += receivedChunksMap[i];
        receivedChunksMap = {}; // 清空備用

        handleParsedSdp(JSON.parse(fullData));
      }
    }

    // 處理解析出來的 SDP
    async function handleParsedSdp(desc) {
      if (desc.type === 'offer') {
        await pc.setRemoteDescription(desc);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        qrLabel.innerText = "已解析 Offer，請回掃此 Answer QR 碼：";
      } else if (desc.type === 'answer') {
        if (!pc.currentRemoteDescription) {
          await pc.setRemoteDescription(desc);
        }
      }
    }

    // --- 按鈕事件 ---
    document.getElementById('btn-create-offer').onclick = async () => {
      dataChannel = pc.createDataChannel("fileTransfer");
      setupDataChannel();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      qrLabel.innerText = "Offer 已建立，請對方掃描此 QR 碼：";
    };

    // --- WebRTC Data Channel 雙向檔案傳輸 ---
    let incomingFileData = [];
    let incomingFileInfo = null;

    function setupDataChannel() {
      dataChannel.binaryType = 'arraybuffer';
      dataChannel.onopen = () => statusText.innerText = "通道已開啟，可以開始傳檔！";
      dataChannel.onmessage = handleDataChannelMessage;
    }

    function handleDataChannelMessage(event) {
      if (typeof event.data === 'string') {
        // 收到檔案元資料 (Meta Info)
        incomingFileInfo = JSON.parse(event.data);
        incomingFileData = [];
      } else {
        // 收到檔案二进制分段
        incomingFileData.push(event.data);
        const receivedSize = incomingFileData.reduce((acc, cur) => acc + cur.byteLength, 0);
        const progress = Math.round((receivedSize / incomingFileInfo.size) * 100);
        
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('progress-text').innerText = `接收中: ${progress}%`;

        if (receivedSize >= incomingFileInfo.size) {
          // 接收完成，組合檔案
          const blob = new Blob(incomingFileData, { type: incomingFileInfo.type });
          const url = URL.createObjectURL(blob);
          
          const a = document.createElement('a');
          a.href = url;
          a.download = incomingFileInfo.name;
          a.innerText = `下載 received_${incomingFileInfo.name}`;
          document.getElementById('download-list').appendChild(a);
          document.getElementById('download-list').appendChild(document.createElement('br'));
          document.getElementById('progress-text').innerText = "接收完成！";
        }
      }
    }

    // 發送檔案
    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file || !dataChannel) return;

      // 傳送 metadata
      dataChannel.send(JSON.stringify({ name: file.name, size: file.size, type: file.type }));

      const chunkSize = 16384; // 16KB 分區傳輸
      const fileReader = new FileReader();
      let offset = 0;

      fileReader.onload = (event) => {
        dataChannel.send(event.target.result);
        offset += event.target.result.byteLength;
        const progress = Math.round((offset / file.size) * 100);
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('progress-text').innerText = `發送中: ${progress}%`;

        if (offset < file.size) {
          readNextChunk();
        } else {
          document.getElementById('progress-text').innerText = "發送完成！";
        }
      };

      function readNextChunk() {
        const slice = file.slice(offset, offset + chunkSize);
        fileReader.readAsArrayBuffer(slice);
      }

      readNextChunk();
    };

    // 啟動鏡頭掃描
    startScanner();
  </script>
</body>
</html>
