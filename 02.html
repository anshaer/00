button, input {
  font: inherit;
}
.app-shell {
  min-height: 100vh;
}
.topbar {
  height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 max(12px, calc((100vw - 620px) / 2));
  color: white;
  background: #151515;
  border-bottom: 3px solid var(--orange);
}
.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: #111;
  background: #fff;
  border-radius: 3px;
}
.topbar h1 {
  margin: 0;
  font-size: 17px;
  line-height: 1.1;
  letter-spacing: .03em;
}
.topbar p {
  margin: 4px 0 0;
  font: 11px/1.2 ui-monospace, monospace;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.standard-chip {
  margin-left: auto;
  padding: 7px 10px;
  border: 1px solid #555;
  border-radius: 5px;
  color: #ddd;
  font-size: 12px;
}
.workspace {
  width: min(620px, 100%);
  margin: 0 auto;
  padding: 0 12px 24px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  align-items: start;
}
.panel {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 0;
  box-shadow: none;
}
.sender-panel, .receiver-panel {
  border-top: 0;
}
.panel-heading {
  display: block;
  margin-bottom: 12px;
}
.panel-heading h2 {
  margin: 0;
  font-size: 17px;
}
.panel-heading p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}
.step {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  color: white;
  border-radius: 7px;
  font: 800 13px ui-monospace, monospace;
}
.step.blue {
  background: var(--blue);
}
.step.orange {
  background: var(--orange);
}
.pickers {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.file-picker {
  min-height: 66px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  cursor: pointer;
  border: 1px solid #cfcfc8;
  border-radius: 0;
  background: #fff;
  transition: .15s ease;
}
.file-picker:hover {
  border-color: var(--blue);
  background: #f6f9ff;
}
.file-picker input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.file-visual {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--blue);
  border: 1px solid var(--line);
  border-radius: 0;
  background: white;
}
.file-visual img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.file-picker strong, .file-picker small {
  display: block;
}
.file-picker strong {
  margin-bottom: 5px;
  font-size: 14px;
}
.file-picker small {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}
.status-row {
  min-height: 36px;
  margin: 10px 0 5px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #a2a29c;
}
.status-dot.ready {
  background: var(--green);
  box-shadow: 0 0 0 4px #178a5a18;
}
.broadcast-wrap {
  position: relative;
  margin-top: 10px;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 2/1;
  border: 1px solid #c9c9c2;
  border-radius: 0;
  background: #fff;
  image-rendering: pixelated;
}
.broadcast-wrap:fullscreen {
  display: grid;
  place-items: center;
  width: 100vw;
  height: 100vh;
  background: #000;
  border: 0;
  border-radius: 0;
}
.broadcast-canvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #f7f7f4;
}
.broadcast-wrap:fullscreen .broadcast-canvas {
  width: min(100vw, 200vh);
  height: auto;
  max-height: 100vh;
}
.frame-progress {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}
.frame-progress span {
  min-width: 72px;
  color: var(--muted);
  font: 11px ui-monospace, monospace;
  text-align: right;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.actions .primary-action, .receiver-actions .camera-action {
  grid-column: 1 / -1;
}
.actions button, .actions a {
  min-height: 40px;
  border-radius: 3px;
  font-weight: 700;
  font-size: 12px;
}
.primary-action {
  background: var(--blue) !important;
}
.camera-action {
  background: var(--orange) !important;
}
.download-action {
  background: var(--green) !important;
}
.camera-stage {
  position: relative;
  overflow: hidden;
  aspect-ratio: 4/3;
  border: 1px solid #cfcfc8;
  border-radius: 0;
  background: #1c1c1b;
  transition: box-shadow .08s;
}
.camera-stage.scan-hit {
  box-shadow: inset 0 0 0 4px #43dd95, 0 0 0 3px #43dd9538;
}
.camera-stage video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.camera-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 9px;
  color: #d7d7d2;
}
.camera-empty strong {
  font-size: 14px;
}
.camera-empty span {
  color: #898984;
  font-size: 11px;
}
.scan-frame {
  position: absolute;
  inset: 10%;
  pointer-events: none;
}
.scan-frame i {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
}
.scan-frame i:nth-child(1) {
  top: 0;
  left: 0;
  border-top: 3px solid;
  border-left: 3px solid;
}
.scan-frame i:nth-child(2) {
  top: 0;
  right: 0;
  border-top: 3px solid;
  border-right: 3px solid;
}
.scan-frame i:nth-child(3) {
  bottom: 0;
  left: 0;
  border-bottom: 3px solid;
  border-left: 3px solid;
}
.scan-frame i:nth-child(4) {
  bottom: 0;
  right: 0;
  border-bottom: 3px solid;
  border-right: 3px solid;
}
.scan-frame span {
  position: absolute;
  top: 0;
  left: 2%;
  right: 2%;
  height: 2px;
  background: #ff7040;
  box-shadow: 0 0 10px #ff7040;
  animation: scan 2.1s ease-in-out infinite;
}
@keyframes scan {
  0%, 100% {
    transform: translateY(5px);
  }
  50% {
    transform: translateY(calc(64vw * .55));
  }
}
.receive-meter {
  margin-top: 13px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
}
.receive-meter > div span, .receive-meter > div strong {
  display: block;
}
.receive-meter > div span {
  color: var(--muted);
  font-size: 10px;
}
.receive-meter > div strong {
  margin-top: 2px;
  font: 700 12px ui-monospace, monospace;
}
.receive-meter b {
  min-width: 33px;
  font: 700 12px ui-monospace, monospace;
  text-align: right;
}
.error-message {
  margin: 12px 0 0;
  padding: 9px 10px;
  color: #972d16;
  background: #fff0eb;
  border-left: 3px solid var(--orange);
  font-size: 12px;
}
.received-card {
  margin-top: 13px;
  padding: 10px 0;
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center;
  gap: 10px;
  border: 0;
  border-top: 1px solid #bcdacb;
  border-bottom: 1px solid #bcdacb;
  border-radius: 0;
  background: #fff;
}
.received-card > img {
  width: 72px;
  height: 60px;
  object-fit: contain;
  background: white;
  border: 1px solid #d7e8df;
  border-radius: 5px;
}
.received-card > div {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--green);
}
.received-card strong, .received-card small {
  display: block;
}
.received-card strong {
  font-size: 12px;
}
.received-card small {
  margin-top: 3px;
  color: #638071;
  font-size: 10px;
}
.receiver-actions {
  margin-top: 14px;
}
.standard-details {
  margin-top: 16px;
  border-top: 1px solid var(--line);
}
.standard-details summary {
  padding: 13px 0 0;
  cursor: pointer;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.standard-details dl {
  margin: 12px 0 0;
  padding: 0;
  background: #fff;
  border-radius: 0;
}
.standard-details dl div {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 5px 0;
  font-size: 11px;
  border-bottom: 1px solid #e5e5df;
}
.standard-details dl div:last-child {
  border: 0;
}
.standard-details dt {
  color: var(--muted);
}
.standard-details dd {
  margin: 0;
  font-family: ui-monospace, monospace;
  text-align: right;
}
footer {
  padding: 4px 20px 24px;
  color: #8b8b85;
  font: 10px ui-monospace, monospace;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: .08em;
}
@media (max-width: 620px) {
  .topbar {
    height: 54px;
    padding: 0 12px;
  }
  .topbar p, .standard-chip {
    display: none;
  }
  .workspace {
    padding: 0 12px 20px;
    gap: 0;
  }
  .panel {
    padding: 16px 0;
    border-radius: 0;
  }
  .received-card {
    grid-template-columns: 60px 1fr;
  }
  .received-card > img {
    width: 60px;
    height: 54px;
  }
  .received-card .download-action {
    grid-column: 1 / -1;
  }
  .panel-heading p {
    font-size: 11px;
  }
}
