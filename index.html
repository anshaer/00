<script>
    let ws = null;
    let refreshTimer = null;
    let isStreaming = false;
    let isRecording = false;
    let currentSceneName = "";
    let isInteracting = false; 

    function connectOBS() {
        if (ws) ws.close();
        const ip = document.getElementById("server-ip").value.trim();
        ws = new WebSocket(`ws://${ip}:4455`);

        ws.onopen = () => console.log("WebSocket 已連接");

        ws.onmessage = (event) => handleMessage(JSON.parse(event.data));

        ws.onclose = () => {
            document.getElementById("conn-status").innerText = "未連線";
            document.getElementById("conn-status").style.color = "var(--danger-color)";
            clearInterval(refreshTimer);
        };

        ws.onerror = () => alert("連接失敗，請確認 IP 或 OBS WebSocket 4455 設定。");
    }

    function sendRequest(requestType, requestData = {}, requestId = null) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                op: 6,
                d: { requestType, requestId: requestId || requestType, requestData }
            }));
        }
    }

    function handleMessage(msg) {
        if (msg.op === 0) {
            // 訂閱全量事件
            ws.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 255 } }));
        }

        if (msg.op === 2) {
            document.getElementById("conn-status").innerText = "已連線";
            document.getElementById("conn-status").style.color = "var(--success-color)";
            
            sendRequest("GetSceneList");
            sendRequest("GetInputList");
            
            clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                sendRequest("GetStreamStatus");
                sendRequest("GetRecordStatus");
            }, 2000);
        }

        if (msg.op === 5) {
            const { eventType, eventData } = msg.d;
            
            if (eventType === "CurrentProgramSceneChanged") {
                currentSceneName = eventData.sceneName;
                sendRequest("GetSceneList");
            }
            if (eventType === "SceneItemEnableStateChanged") {
                updateSourceVisibilityUI(eventData.sceneItemId, eventData.sceneItemEnabled);
            }
            if (eventType === "InputMuteStateChanged") {
                updateMuteUI(eventData.inputName, eventData.inputMuted);
            }
            if (eventType === "InputVolumeChanged" && !isInteracting) {
                updateVolumeUI(eventData.inputName, eventData.inputVolumeMul);
            }
            if (eventType === "InputAudioBalanceChanged" && !isInteracting) {
                updateBalanceUI(eventData.inputName, eventData.inputAudioBalance);
            }
        }

        if (msg.op === 7 && msg.d.requestStatus.result) {
            const reqType = msg.d.requestType;
            const resData = msg.d.responseData;
            const reqId = msg.d.requestId;

            if (reqType === "GetStreamStatus") {
                document.getElementById("bitrate").innerText = `${resData.outputBytes ? Math.round((resData.outputBytes * 8) / 1024) : 0} kbps`;
                const total = resData.outputTotalFrames || 0;
                const skipped = resData.outputSkippedFrames || 0;
                document.getElementById("dropped-frames").innerText = `${total > 0 ? ((skipped / total) * 100).toFixed(1) : 0}%`;
                
                isStreaming = resData.outputActive;
                const sBtn = document.getElementById("btn-toggle-stream");
                sBtn.innerText = isStreaming ? "關閉串流" : "開始串流";
                sBtn.className = `btn-action btn-stream ${isStreaming ? 'active' : ''}`;
            }

            if (reqType === "GetRecordStatus") {
                isRecording = resData.outputActive;
                const rBtn = document.getElementById("btn-toggle-record");
                rBtn.innerText = isRecording ? "停止錄影" : "開始錄影";
                rBtn.className = `btn-action btn-record ${isRecording ? 'active' : ''}`;
            }

            if (reqType === "GetSceneList") {
                currentSceneName = resData.currentProgramSceneName;
                renderSceneList(resData.scenes, currentSceneName);
                sendRequest("GetSceneItemList", { sceneName: currentSceneName });
            }

            if (reqType === "GetSceneItemList") {
                renderSourceList(resData.sceneItems);
            }

            if (reqType === "GetInputList") {
                buildAudioListDOM(resData.inputs);
            }

            if (reqId.startsWith("InitVol_")) updateVolumeUI(reqId.replace("InitVol_", ""), resData.inputVolumeMul);
            if (reqId.startsWith("InitMute_")) updateMuteUI(reqId.replace("InitMute_", ""), resData.inputMuted);
            if (reqId.startsWith("InitBal_")) updateBalanceUI(reqId.replace("InitBal_", ""), resData.inputAudioBalance);
            if (reqId.startsWith("InitMon_")) updateMonitorUI(reqId.replace("InitMon_", ""), resData.monitorType);
        }
    }

    /* --- 1. 場景列表 --- */
    function renderSceneList(scenes, activeScene) {
        const el = document.getElementById("scenes-list");
        el.innerHTML = "";
        scenes.forEach(s => {
            const li = document.createElement("li");
            li.className = `scene-item ${s.sceneName === activeScene ? 'active' : ''}`;
            li.innerText = s.sceneName;
            li.onclick = () => {
                sendRequest("SetCurrentProgramScene", { sceneName: s.sceneName });
            };
            el.appendChild(li);
        });
    }

    /* --- 2. 來源 可見/隱藏 關鍵修正 --- */
    function renderSourceList(sources) {
        const el = document.getElementById("sources-list");
        el.innerHTML = "";
        sources.forEach(item => {
            const li = document.createElement("li");
            li.className = "card-item";
            li.innerHTML = `
                <div class="card-row">
                    <span>${item.sourceName}</span>
                    <button id="src-btn-${item.sceneItemId}" 
                            class="icon-btn ${item.sceneItemEnabled ? 'visible' : ''}" 
                            onclick="toggleSourceVisible(${item.sceneItemId}, ${!item.sceneItemEnabled})">
                        ${item.sceneItemEnabled ? '顯示中' : '已隱藏'}
                    </button>
                </div>
            `;
            el.appendChild(li);
        });
    }

    function toggleSourceVisible(itemId, enable) {
        if (!currentSceneName) return;
        
        // 1. 立即在網頁端強制更新 UI（解決反應延遲與卡住無法點擊的問題）
        updateSourceVisibilityUI(itemId, enable);

        // 2. 向 OBS 發送開關請求
        sendRequest("SetSceneItemEnabled", {
            sceneName: currentSceneName,
            sceneItemId: itemId,
            sceneItemEnabled: enable
        });

        // 3. 0.2 秒後主動向 OBS 重新請求來源狀態，確保兩端同步
        setTimeout(() => {
            sendRequest("GetSceneItemList", { sceneName: currentSceneName });
        }, 200);
    }

    function updateSourceVisibilityUI(itemId, enabled) {
        const btn = document.getElementById(`src-btn-${itemId}`);
        if (btn) {
            btn.innerText = enabled ? '顯示中' : '已隱藏';
            btn.className = `icon-btn ${enabled ? 'visible' : ''}`;
            // 動態更新 onclick 的目標值 (!enabled)，讓下次點擊能正確切換
            btn.onclick = () => toggleSourceVisible(itemId, !enabled);
        }
    }

    /* --- 3. 音軌控制 --- */
    function buildAudioListDOM(inputs) {
        const el = document.getElementById("audio-list");
        el.innerHTML = "";

        const audioInputs = inputs.filter(i => i.inputKind && (
            i.inputKind.includes("audio") || i.inputKind.includes("wasapi") || i.inputKind.includes("mic")
        ));

        audioInputs.forEach(i => {
            const name = i.inputName;
            const li = document.createElement("li");
            li.className = "card-item";
            li.innerHTML = `
                <div class="card-row">
                    <strong>${name}</strong>
                    <button class="icon-btn" id="mute-btn-${name}" onclick="toggleMute('${name}')">開音</button>
                </div>
                <div class="slider-container">
                    <span>音量</span>
                    <input type="range" id="vol-${name}" min="0" max="1" step="0.01" 
                           ontouchstart="isInteracting=true" ontouchend="isInteracting=false"
                           onmousedown="isInteracting=true" onmouseup="isInteracting=false"
                           onchange="setVolume('${name}', this.value)">
                </div>
                <div class="slider-container">
                    <span>平衡</span>
                    <input type="range" id="pan-${name}" min="0" max="1" step="0.01" 
                           ontouchstart="isInteracting=true" ontouchend="isInteracting=false"
                           onmousedown="isInteracting=true" onmouseup="isInteracting=false"
                           onchange="setPan('${name}', this.value)">
                </div>
                <div class="card-row">
                    <span style="font-size:0.85em; color:var(--text-sub)">音訊監聽</span>
                    <select id="monitor-${name}" onchange="setMonitor('${name}', this.value)">
                        <option value="OBS_MONITORING_TYPE_NONE">關閉監聽</option>
                        <option value="OBS_MONITORING_TYPE_MONITOR_ONLY">僅監聽 (不輸出)</option>
                        <option value="OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT">監聽並輸出</option>
                    </select>
                </div>
            `;
            el.appendChild(li);

            sendRequest("GetInputVolume", { inputName: name }, `InitVol_${name}`);
            sendRequest("GetInputMute", { inputName: name }, `InitMute_${name}`);
            sendRequest("GetInputAudioBalance", { inputName: name }, `InitBal_${name}`);
            sendRequest("GetInputAudioMonitorType", { inputName: name }, `InitMon_${name}`);
        });
    }

    function updateVolumeUI(name, val) {
        const el = document.getElementById(`vol-${name}`);
        if (el) el.value = val;
    }
    function updateBalanceUI(name, val) {
        const el = document.getElementById(`pan-${name}`);
        if (el) el.value = val;
    }
    function updateMuteUI(name, isMuted) {
        const btn = document.getElementById(`mute-btn-${name}`);
        if (btn) {
            btn.innerText = isMuted ? "已靜音" : "開啟中";
            btn.className = `icon-btn ${isMuted ? 'muted' : 'visible'}`;
        }
    }
    function updateMonitorUI(name, monType) {
        const select = document.getElementById(`monitor-${name}`);
        if (select) select.value = monType;
    }

    /* API 控制 */
    function toggleStream() { sendRequest(isStreaming ? "StopStream" : "StartStream"); }
    function toggleRecord() { sendRequest(isRecording ? "StopRecord" : "StartRecord"); }
    function toggleMute(name) { sendRequest("ToggleInputMute", { inputName: name }); }
    
    function setVolume(name, val) { 
        sendRequest("SetInputVolume", { inputName: name, inputVolumeMul: parseFloat(val) }); 
    }
    function setPan(name, val) { 
        sendRequest("SetInputAudioBalance", { inputName: name, inputAudioBalance: parseFloat(val) }); 
    }
    function setMonitor(name, val) { 
        sendRequest("SetInputAudioMonitorType", { inputName: name, monitorType: val }); 
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }
</script>
