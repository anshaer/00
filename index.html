<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS 手機控制台</title>
    <style>
        :root {
            --bg-color: #121216;
            --card-bg: #1e1e24;
            --accent-color: #00bcd4;
            --danger-color: #ff5252;
            --success-color: #4caf50;
            --disabled-color: #0d0d10;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 12px; font-size: 14px;
        }

        /* 連線設定區 */
        .conn-box {
            background: var(--card-bg); padding: 10px; border-radius: 8px;
            display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
        }
        .conn-box input {
            flex: 1; background: #2b2b36; border: 1px solid #444; color: #fff;
            padding: 8px 12px; border-radius: 6px; font-size: 0.95em; outline: none;
        }
        .conn-box button {
            background: var(--accent-color); border: none; color: #000;
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* 頂部狀態列 */
        .status-header {
            background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 12px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center;
        }
        .stat-item .label { font-size: 0.7em; color: var(--text-sub); }
        .stat-item .val { font-size: 0.95em; font-weight: bold; color: var(--accent-color); margin-top: 2px; }

        /* 串流與錄影控制按鈕 */
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .btn-action {
            padding: 12px; border: none; border-radius: 8px; font-weight: bold;
            color: #fff; cursor: pointer; font-size: 1em; text-align: center;
        }
        .btn-stream { background: #388e3c; }
        .btn-stream.active { background: var(--danger-color); }
        .btn-record { background: #1976d2; }
        .btn-record.active { background: var(--danger-color); }

        /* 頁籤排版 */
        .tab-nav { display: flex; border-bottom: 2px solid #333; margin-bottom: 12px; }
        .tab-btn {
            flex: 1; padding: 10px 0; text-align: center; background: none; border: none;
            color: var(--text-sub); font-size: 0.95em; font-weight: bold; cursor: pointer;
            border-bottom: 3px solid transparent; margin-bottom: -2px;
        }
        .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 列表與卡片 */
        ul { list-style: none; padding: 0; margin: 0; }
        .card-item {
            background: var(--card-bg); border-radius: 8px; padding: 12px; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .card-row { display: flex; justify-content: space-between; align-items: center; }

        /* 上傳圖片卡片 */
        .upload-card { border: 1px dashed var(--accent-color); background: #181820; }
        .upload-card input[type=text] {
            width: 100%; background: #2b2b36; border: 1px solid #444; color: #fff;
            padding: 8px; border-radius: 4px; outline: none;
        }

        /* 尺寸與位置調整面板 */
        .transform-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            background: #252530; padding: 8px; border-radius: 6px;
        }
        .transform-box.disabled {
            background: var(--disabled-color); opacity: 0.35; pointer-events: none;
        }
        .ratio-row {
            grid-column: span 2; display: flex; align-items: center; gap: 6px;
            font-size: 0.8em; color: var(--accent-color); margin-bottom: 2px;
        }
        .input-group { display: flex; align-items: center; gap: 4px; font-size: 0.8em; color: var(--text-sub); }
        .input-group input[type=number] {
            width: 100%; background: #1a1a22; border: 1px solid #444; color: #fff;
            padding: 4px 6px; border-radius: 4px; text-align: center; font-size: 0.9em;
        }

        /* 場景與按鈕 */
        .scene-item {
            padding: 14px; background: var(--card-bg); border-radius: 8px; margin-bottom: 8px;
            font-size: 1em; cursor: pointer; border-left: 4px solid transparent;
        }
        .scene-item.active { border-left-color: var(--accent-color); background: #252535; font-weight: bold; }

        .icon-btn {
            background: #2b2b36; border: 1px solid #444; color: #fff; padding: 8px 14px;
            border-radius: 4px; font-size: 0.85em; cursor: pointer; min-width: 75px; text-align: center;
        }
        .icon-btn.muted { background: var(--danger-color); border-color: var(--danger-color); }
        .icon-btn.visible { background: var(--success-color); border-color: var(--success-color); }

        .slider-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        .slider-container span { font-size: 0.8em; color: var(--text-sub); width: 35px; }
        .slider-container input[type=range] { flex: 1; height: 24px; }
        select { background: #2b2b36; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="conn-box">
    <input type="text" id="server-ip" value="192.168.1.200" placeholder="輸入電腦 IP">
    <button onclick="connectOBS()">連接 :4455</button>
</div>

<div class="status-header">
    <div class="stat-item"><div class="label">連線狀態</div><div id="conn-status" class="val" style="color:var(--danger-color)">未連線</div></div>
    <div class="stat-item"><div class="label">輸出畫質</div><div id="video-res" class="val">--</div></div>
    <div class="stat-item"><div class="label">位元率</div><div id="bitrate" class="val">0 kbps</div></div>
    <div class="stat-item"><div class="label">掉幀</div><div id="dropped-frames" class="val">0%</div></div>
</div>

<div class="action-btns">
    <button id="btn-toggle-stream" class="btn-action btn-stream" onclick="toggleStream()">開始串流</button>
    <button id="btn-toggle-record" class="btn-action btn-record" onclick="toggleRecord()">開始錄影</button>
</div>

<div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('tab-scenes', this)">場景</button>
    <button class="tab-btn" onclick="switchTab('tab-sources', this)">來源與排版</button>
    <button class="tab-btn" onclick="switchTab('tab-audio', this)">音軌控制</button>
</div>

<div id="tab-scenes" class="tab-content active">
    <ul id="scenes-list"></ul>
</div>

<div id="tab-sources" class="tab-content">
    <div class="card-item upload-card">
        <strong>新增手機圖片來源</strong>
        <input type="text" id="new-source-name" placeholder="輸入來源名稱 (留空預設為: 手機圖片)">
        <input type="file" id="img-uploader" accept="image/*" style="display:none;" onchange="uploadImageToOBS(this)">
        <button class="btn-action btn-record" style="width:100%; font-size:0.9em; padding:10px;" onclick="document.getElementById('img-uploader').click()">選取照片並上傳至 OBS</button>
    </div>

    <ul id="sources-list"></ul>
</div>

<div id="tab-audio" class="tab-content">
    <ul id="audio-list"></ul>
</div>

<script>
    let ws = null;
    let refreshTimer = null;
    let isStreaming = false;
    let isRecording = false;
    let currentSceneName = "";
    let isInteracting = false; 

    // 紀錄各來源原始比例 { itemId: ratio }
    let sourceRatios = {};

    function connectOBS() {
        if (ws) ws.close();
        const ip = document.getElementById("server-ip").value.trim();
        ws = new WebSocket(`ws://${ip}:4455`);

        ws.onopen = () => console.log("WebSocket 已連接");
        ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
        ws.onclose = () => {
            document.getElementById("conn-status").innerText = "未連線";
            document.getElementById("conn-status").style.color = "var(--danger-color)";
            document.getElementById("video-res").innerText = "--";
            clearInterval(refreshTimer);
        };
        ws.onerror = () => alert("連接失敗，請確認 IP 或 OBS WebSocket 4455 設定。");
    }

    function sendRequest(requestType, requestData = {}, requestId = null) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                op: 6,
                d: { requestType, requestId: requestId || requestType, requestData }
            }));
        }
    }

    function handleMessage(msg) {
        if (msg.op === 0) {
            ws.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 255 } }));
        }

        if (msg.op === 2) {
            document.getElementById("conn-status").innerText = "已連線";
            document.getElementById("conn-status").style.color = "var(--success-color)";
            
            sendRequest("GetVideoSettings");
            sendRequest("GetSceneList");
            sendRequest("GetInputList");
            
            clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                sendRequest("GetStreamStatus");
                sendRequest("GetRecordStatus");
            }, 2000);
        }

        if (msg.op === 5) {
            const { eventType, eventData } = msg.d;
            if (eventType === "CurrentProgramSceneChanged") {
                currentSceneName = eventData.sceneName;
                sendRequest("GetSceneList");
            }
            if (eventType === "SceneItemEnableStateChanged") {
                updateSourceVisibilityUI(eventData.sceneItemId, eventData.sceneItemEnabled);
            }
            if (eventType === "SceneItemTransformChanged") {
                updateTransformUI(eventData.sceneItemId, eventData.sceneItemTransform);
            }
            if (eventType === "InputMuteStateChanged") {
                updateMuteUI(eventData.inputName, eventData.inputMuted);
            }
            if (eventType === "InputVolumeChanged" && !isInteracting) {
                updateVolumeUI(eventData.inputName, eventData.inputVolumeMul);
            }
            if (eventType === "InputAudioBalanceChanged" && !isInteracting) {
                updateBalanceUI(eventData.inputName, eventData.inputAudioBalance);
            }
        }

        if (msg.op === 7 && msg.d.requestStatus.result) {
            const reqType = msg.d.requestType;
            const resData = msg.d.responseData;
            const reqId = msg.d.requestId;

            if (reqType === "GetVideoSettings") {
                const fps = Math.round(resData.fpsNumerator / resData.fpsDenominator);
                document.getElementById("video-res").innerText = `${resData.outputWidth}x${resData.outputHeight} p${fps}`;
            }

            if (reqType === "GetStreamStatus") {
                document.getElementById("bitrate").innerText = `${resData.outputBytes ? Math.round((resData.outputBytes * 8) / 1024) : 0} kbps`;
                const total = resData.outputTotalFrames || 0;
                const skipped = resData.outputSkippedFrames || 0;
                document.getElementById("dropped-frames").innerText = `${total > 0 ? ((skipped / total) * 100).toFixed(1) : 0}%`;
                
                isStreaming = resData.outputActive;
                const sBtn = document.getElementById("btn-toggle-stream");
                sBtn.innerText = isStreaming ? "關閉串流" : "開始串流";
                sBtn.className = `btn-action btn-stream ${isStreaming ? 'active' : ''}`;
            }

            if (reqType === "GetRecordStatus") {
                isRecording = resData.outputActive;
                const rBtn = document.getElementById("btn-toggle-record");
                rBtn.innerText = isRecording ? "停止錄影" : "開始錄影";
                rBtn.className = `btn-action btn-record ${isRecording ? 'active' : ''}`;
            }

            if (reqType === "GetSceneList") {
                currentSceneName = resData.currentProgramSceneName;
                renderSceneList(resData.scenes, currentSceneName);
                sendRequest("GetSceneItemList", { sceneName: currentSceneName });
            }

            if (reqType === "GetSceneItemList") renderSourceList(resData.sceneItems);
            if (reqType === "GetInputList") buildAudioListDOM(resData.inputs);

            if (reqId === "CreateImageSource") {
                alert("圖片成功新增至 OBS 畫面！");
                sendRequest("GetSceneItemList", { sceneName: currentSceneName });
            }

            if (reqId.startsWith("InitVol_")) updateVolumeUI(reqId.replace("InitVol_", ""), resData.inputVolumeMul);
            if (reqId.startsWith("InitMute_")) updateMuteUI(reqId.replace("InitMute_", ""), resData.inputMuted);
            if (reqId.startsWith("InitBal_")) updateBalanceUI(reqId.replace("InitBal_", ""), resData.inputAudioBalance);
            if (reqId.startsWith("InitMon_")) updateMonitorUI(reqId.replace("InitMon_", ""), resData.monitorType);
        }
    }

    /* --- (1) 修正新增圖片閃退：極致安全前端壓縮限制 --- */
    function uploadImageToOBS(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;

        let sourceName = document.getElementById("new-source-name").value.trim();
        if (!sourceName) {
            sourceName = "手機圖片_" + Math.floor(Math.random() * 1000);
        }

        const ip = document.getElementById("server-ip").value.trim();
        const reader = new FileReader();

        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                // 安全尺寸限制：寬高上限 1280px，防止超大解析度壓垮 OBS
                const MAX_LIMIT = 1280;
                let width = img.width, height = img.height;

                if (width > MAX_LIMIT || height > MAX_LIMIT) {
                    if (width > height) {
                        height = Math.round(height * (MAX_LIMIT / width));
                        width = MAX_LIMIT;
                    } else {
                        width = Math.round(width * (MAX_LIMIT / height));
                        height = MAX_LIMIT;
                    }
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                // 轉為輕量 Base64 縮圖 (品質 0.7)
                const safeBase64 = canvas.toDataURL("image/jpeg", 0.7);

                // 首選：嘗試傳給電腦 8080 後端 (如果使用者有開 server.py)
                fetch(`http://${ip}:8080/upload`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename: `${Date.now()}.jpg`, image: safeBase64 })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        sendRequest("CreateInput", {
                            sceneName: currentSceneName,
                            inputName: sourceName,
                            inputKind: "image_source",
                            inputSettings: { file: data.file_path },
                            sceneItemEnabled: true
                        }, "CreateImageSource");
                    }
                })
                .catch(() => {
                    // 後端無回應時的 Safe 備案：發送縮小的 Base64 給 OBS
                    sendRequest("CreateInput", {
                        sceneName: currentSceneName,
                        inputName: sourceName,
                        inputKind: "image_source",
                        inputSettings: { file: safeBase64 },
                        sceneItemEnabled: true
                    }, "CreateImageSource");
                });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        fileInput.value = "";
    }

    /* --- 1. 場景列表 --- */
    function renderSceneList(scenes, activeScene) {
        const el = document.getElementById("scenes-list");
        el.innerHTML = "";
        scenes.forEach(s => {
            const li = document.createElement("li");
            li.className = `scene-item ${s.sceneName === activeScene ? 'active' : ''}`;
            li.innerText = s.sceneName;
            li.onclick = () => sendRequest("SetCurrentProgramScene", { sceneName: s.sceneName });
            el.appendChild(li);
        });
    }

    /* --- 2. 來源列表與 (2) 保持比例動態變更 --- */
    function renderSourceList(sources) {
        const el = document.getElementById("sources-list");
        el.innerHTML = "";

        sources.forEach(item => {
            const li = document.createElement("li");
            li.className = "card-item";

            const kind = (item.inputKind || "").toLowerCase();
            const isAudioOnly = kind.includes("audio") || kind.includes("wasapi") || kind.includes("mic");

            const tf = item.sceneItemTransform || {};
            const width = Math.round(tf.boundsWidth || tf.sourceWidth || 100);
            const height = Math.round(tf.boundsHeight || tf.sourceHeight || 100);
            const posX = Math.round(tf.positionX || 0);
            const posY = Math.round(tf.positionY || 0);

            // 紀錄該來源的初始比例
            sourceRatios[item.sceneItemId] = height > 0 ? (width / height) : 1;

            li.innerHTML = `
                <div class="card-row">
                    <strong>${item.sourceName}</strong>
                    <button id="src-btn-${item.sceneItemId}" 
                            class="icon-btn ${item.sceneItemEnabled ? 'visible' : ''}" 
                            onclick="toggleSourceVisible(${item.sceneItemId}, ${!item.sceneItemEnabled})">
                        ${item.sceneItemEnabled ? '顯示中' : '已隱藏'}
                    </button>
                </div>

                <div class="transform-box ${isAudioOnly ? 'disabled' : ''}">
                    <div class="ratio-row">
                        <input type="checkbox" id="lock-ratio-${item.sceneItemId}" checked ${isAudioOnly ? 'disabled' : ''}>
                        <label for="lock-ratio-${item.sceneItemId}">保持等比例調整</label>
                    </div>

                    <div class="input-group">
                        <span>寬W:</span>
                        <input type="number" id="tf-w-${item.sceneItemId}" value="${width}" ${isAudioOnly ? 'disabled' : ''} onchange="applyTransform(${item.sceneItemId}, 'w')">
                    </div>
                    <div class="input-group">
                        <span>高H:</span>
                        <input type="number" id="tf-h-${item.sceneItemId}" value="${height}" ${isAudioOnly ? 'disabled' : ''} onchange="applyTransform(${item.sceneItemId}, 'h')">
                    </div>
                    <div class="input-group">
                        <span>位X:</span>
                        <input type="number" id="tf-x-${item.sceneItemId}" value="${posX}" ${isAudioOnly ? 'disabled' : ''} onchange="applyTransform(${item.sceneItemId}, 'x')">
                    </div>
                    <div class="input-group">
                        <span>位Y:</span>
                        <input type="number" id="tf-y-${item.sceneItemId}" value="${posY}" ${isAudioOnly ? 'disabled' : ''} onchange="applyTransform(${item.sceneItemId}, 'y')">
                    </div>
                </div>
            `;
            el.appendChild(li);
        });
    }

    /* (2) 保持等比例數值連動計算 */
    function applyTransform(itemId, changedType) {
        const elW = document.getElementById(`tf-w-${itemId}`);
        const elH = document.getElementById(`tf-h-${itemId}`);
        const elX = document.getElementById(`tf-x-${itemId}`);
        const elY = document.getElementById(`tf-y-${itemId}`);
        const isRatioLocked = document.getElementById(`lock-ratio-${itemId}`).checked;

        let w = parseFloat(elW.value) || 10;
        let h = parseFloat(elH.value) || 10;
        const x = parseFloat(elX.value) || 0;
        const y = parseFloat(elY.value) || 0;

        const ratio = sourceRatios[itemId] || 1;

        // 如果勾選保持比例，自動算算另一邊數值
        if (isRatioLocked) {
            if (changedType === 'w') {
                h = Math.round(w / ratio);
                elH.value = h;
            } else if (changedType === 'h') {
                w = Math.round(h * ratio);
                elW.value = w;
            }
        } else {
            // 未鎖定時更新當前比例
            if (h > 0) sourceRatios[itemId] = w / h;
        }

        sendRequest("SetSceneItemTransform", {
            sceneName: currentSceneName,
            sceneItemId: itemId,
            sceneItemTransform: {
                positionX: x,
                positionY: y,
                boundsType: "OBS_BOUNDS_SCALE_INNER",
                boundsWidth: w,
                boundsHeight: h
            }
        });
    }

    function updateTransformUI(itemId, tf) {
        if (!tf) return;
        const elW = document.getElementById(`tf-w-${itemId}`);
        const elH = document.getElementById(`tf-h-${itemId}`);
        const elX = document.getElementById(`tf-x-${itemId}`);
        const elY = document.getElementById(`tf-y-${itemId}`);

        const w = Math.round(tf.boundsWidth || tf.sourceWidth || 0);
        const h = Math.round(tf.boundsHeight || tf.sourceHeight || 0);

        if (elW) elW.value = w;
        if (elH) elH.value = h;
        if (elX) elX.value = Math.round(tf.positionX || 0);
        if (elY) elY.value = Math.round(tf.positionY || 0);

        if (h > 0) sourceRatios[itemId] = w / h;
    }

    function toggleSourceVisible(itemId, enable) {
        if (!currentSceneName) return;
        updateSourceVisibilityUI(itemId, enable);
        sendRequest("SetSceneItemEnabled", {
            sceneName: currentSceneName,
            sceneItemId: itemId,
            sceneItemEnabled: enable
        });
        setTimeout(() => {
            sendRequest("GetSceneItemList", { sceneName: currentSceneName });
        }, 200);
    }

    function updateSourceVisibilityUI(itemId, enabled) {
        const btn = document.getElementById(`src-btn-${itemId}`);
        if (btn) {
            btn.innerText = enabled ? '顯示中' : '已隱藏';
            btn.className = `icon-btn ${enabled ? 'visible' : ''}`;
            btn.onclick = () => toggleSourceVisible(itemId, !enabled);
        }
    }

    /* --- 3. 音軌控制 --- */
    function buildAudioListDOM(inputs) {
        const el = document.getElementById("audio-list");
        el.innerHTML = "";

        const audioInputs = inputs.filter(i => i.inputKind && (
            i.inputKind.includes("audio") || i.inputKind.includes("wasapi") || i.inputKind.includes("mic")
        ));

        audioInputs.forEach(i => {
            const name = i.inputName;
            const li = document.createElement("li");
            li.className = "card-item";
            li.innerHTML = `
                <div class="card-row">
                    <strong>${name}</strong>
                    <button class="icon-btn" id="mute-btn-${name}" onclick="toggleMute('${name}')">開音</button>
                </div>
                <div class="slider-container">
                    <span>音量</span>
                    <input type="range" id="vol-${name}" min="0" max="1" step="0.01" 
                           ontouchstart="isInteracting=true" ontouchend="isInteracting=false"
                           onmousedown="isInteracting=true" onmouseup="isInteracting=false"
                           onchange="setVolume('${name}', this.value)">
                </div>
                <div class="slider-container">
                    <span>平衡</span>
                    <input type="range" id="pan-${name}" min="0" max="1" step="0.01" 
                           ontouchstart="isInteracting=true" ontouchend="isInteracting=false"
                           onmousedown="isInteracting=true" onmouseup="isInteracting=false"
                           onchange="setPan('${name}', this.value)">
                </div>
                <div class="card-row">
                    <span style="font-size:0.85em; color:var(--text-sub)">音訊監聽</span>
                    <select id="monitor-${name}" onchange="setMonitor('${name}', this.value)">
                        <option value="OBS_MONITORING_TYPE_NONE">關閉監聽</option>
                        <option value="OBS_MONITORING_TYPE_MONITOR_ONLY">僅監聽 (不輸出)</option>
                        <option value="OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT">監聽並輸出</option>
                    </select>
                </div>
            `;
            el.appendChild(li);

            sendRequest("GetInputVolume", { inputName: name }, `InitVol_${name}`);
            sendRequest("GetInputMute", { inputName: name }, `InitMute_${name}`);
            sendRequest("GetInputAudioBalance", { inputName: name }, `InitBal_${name}`);
            sendRequest("GetInputAudioMonitorType", { inputName: name }, `InitMon_${name}`);
        });
    }

    function updateVolumeUI(name, val) {
        const el = document.getElementById(`vol-${name}`);
        if (el) el.value = val;
    }
    function updateBalanceUI(name, val) {
        const el = document.getElementById(`pan-${name}`);
        if (el) el.value = val;
    }
    function updateMuteUI(name, isMuted) {
        const btn = document.getElementById(`mute-btn-${name}`);
        if (btn) {
            btn.innerText = isMuted ? "已靜音" : "開啟中";
            btn.className = `icon-btn ${isMuted ? 'muted' : 'visible'}`;
        }
    }
    function updateMonitorUI(name, monType) {
        const select = document.getElementById(`monitor-${name}`);
        if (select) select.value = monType;
    }

    /* API 控制 */
    function toggleStream() { sendRequest(isStreaming ? "StopStream" : "StartStream"); }
    function toggleRecord() { sendRequest(isRecording ? "StopRecord" : "StartRecord"); }
    function toggleMute(name) { sendRequest("ToggleInputMute", { inputName: name }); }
    function setVolume(name, val) { sendRequest("SetInputVolume", { inputName: name, inputVolumeMul: parseFloat(val) }); }
    function setPan(name, val) { sendRequest("SetInputAudioBalance", { inputName: name, inputAudioBalance: parseFloat(val) }); }
    function setMonitor(name, val) { sendRequest("SetInputAudioMonitorType", { inputName: name, monitorType: val }); }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
