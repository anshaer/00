<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手機 WebRTC 麥克風</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#181818;background:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.dot{width:16px;height:16px;border-radius:50%;background:#777}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.small,#latency{font-size:13px;color:#888}.cam{position:relative;background:#111;border-radius:12px;overflow:hidden;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}.scan{position:absolute;left:10px;right:10px;bottom:10px;background:#000a;color:#fff;padding:8px;border-radius:8px;font-size:13px}.hidden{display:none!important}button{min-height:44px;border:0;border-radius:10px;padding:0 14px;font-size:16px;background:#1769e0;color:#fff;margin-top:12px}.ctl{margin:15px 0}.ctl label{display:flex;justify-content:space-between;margin-bottom:5px}.ctl output{color:#666}input[type=range]{width:100%;height:34px}#error{font-size:13px;color:#b3261e;white-space:pre-wrap}</style></head><body><div class="wrap"><div class="top"><h1>手機麥克風</h1><div id="dot" class="dot"></div></div><div id="cameraCard" class="card"><div class="cam"><video id="video" autoplay playsinline muted></video><div id="scanText" class="scan">請掃描 OBS WebSocket「Show Connect Info」QR</div></div><button id="startScan">開啟相機</button></div><div id="statusCard" class="card hidden"><div id="statusText">正在建立連線…</div><div id="latency"></div><div id="error"></div></div><div id="micCard" class="card hidden">
<div class="ctl"><label><span>增益</span><output id="gainOut">100%</output></label><input id="gain" type="range" min="0" max="200" value="100"></div>
<div class="ctl"><label><span>延遲</span><output id="delayOut">0 ms</output></label><input id="delay" type="range" min="0" max="1000" value="0" step="10"></div>
<div class="ctl"><label><span>去雜音</span><output id="noiseOut">50%</output></label><input id="noise" type="range" min="0" max="100" value="50"></div>
<div class="ctl"><label><span>低頻抑制</span><output id="lowOut">80 Hz</output></label><input id="low" type="range" min="20" max="300" value="80" step="5"></div>
<div class="ctl"><label><span>壓縮</span><output id="compOut">40%</output></label><input id="comp" type="range" min="0" max="100" value="40"></div>
<div class="ctl"><label><span>回聲</span><output id="echoOut">0%</output></label><input id="echo" type="range" min="0" max="70" value="0"></div>
<div class="small">只處理這支手機送往 OBS 的麥克風。</div></div></div><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
(()=>{'use strict';const APP='obs-audio-bridge-v1',peerId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2),$=id=>document.getElementById(id),COL={idle:'#777',wait:'#e0aa18',ok:'#20b85a',err:'#e24a4a'};let cam,raf,obs,pc,receiver,raw,ctx,fx,gateRAF,stats,pending=[];const st=s=>$('dot').style.background=COL[s]||COL.idle;const status=(t,e='')=>{$('statusCard').classList.remove('hidden');$('statusText').textContent=t;$('error').textContent=e};st('idle');
const b64=a=>{let s='';a.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};async function sha(t){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))}async function auth(p,s,c){const sec=b64(await sha(p+s));return b64(await sha(sec+c))}
class O{constructor(){this.r=0}connect(url,password){return new Promise((res,rej)=>{let done=false;try{this.ws=new WebSocket(url,'obswebsocket.json')}catch(e){rej(e);return}const bad=e=>{if(!done){done=true;rej(e instanceof Error?e:new Error('OBS WebSocket 失敗'))}};this.ws.onerror=()=>bad(new Error('無法連到 OBS WebSocket'));this.ws.onclose=e=>{this.ready=false;if(!done)bad(new Error('OBS WebSocket 關閉 '+e.code))};this.ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.op===0){try{const h=m.d||{},id={rpcVersion:1,eventSubscriptions:1};if(h.authentication){if(!password)throw new Error('QR 沒有密碼');id.authentication=await auth(password,h.authentication.salt,h.authentication.challenge)}this.ws.send(JSON.stringify({op:1,d:id}))}catch(x){bad(x);try{this.ws.close()}catch{}}}else if(m.op===2){this.ready=true;if(!done){done=true;res()}}else if(m.op===5&&m.d?.eventType==='CustomEvent'){const d=m.d.eventData;if(d?.app===APP&&this.onCustom)this.onCustom(d)}}})}broadcast(d){if(!this.ready)return;this.ws.send(JSON.stringify({op:6,d:{requestType:'BroadcastCustomEvent',requestId:'p'+Date.now()+(++this.r),requestData:{eventData:{app:APP,...d}}}}))}}
function qr(text){text=text.trim();if(/^obswss?:\/\//i.test(text)){const sec=/^obswss:\/\//i.test(text),u=new URL(text.replace(/^obswss?:\/\//i,sec?'https://':'http://'));return{url:`${sec?'wss':'ws'}://${u.hostname}:${u.port||4455}`,password:decodeURIComponent(u.pathname.replace(/^\//,''))}}if(/^obswebsocket\|/i.test(text)){const p=text.split('|');return{url:'ws://'+p[1],password:p[2]||''}}throw new Error('不是 OBS WebSocket Connect Info QR')}
async function stopCam(){cancelAnimationFrame(raf);if(cam)cam.getTracks().forEach(t=>t.stop());cam=null;$('cameraCard').classList.add('hidden')}
async function camera(){try{if(cam)return;cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=cam;await $('video').play();scan()}catch(e){st('err');status('相機無法啟動',e.message||String(e))}}
async function scan(){const v=$('video'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let det=null;try{if('BarcodeDetector'in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}}catch{}let last=0;const loop=async n=>{raf=requestAnimationFrame(loop);if(n-last<180||v.readyState<2)return;last=n;let txt='';try{if(det){const c=await det.detect(v);txt=c[0]?.rawValue||''}else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),c=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});txt=c?.data||''}}catch{}if(txt){cancelAnimationFrame(raf);connectQR(txt)}};raf=requestAnimationFrame(loop)}
async function connectQR(t){try{st('wait');$('scanText').textContent='已讀到 QR，正在連 OBS WebSocket…';const c=qr(t);obs=new O();obs.onCustom=signal;await obs.connect(c.url,c.password);await stopCam();status('OBS WebSocket 已連線，正在建立 WebRTC…');await webrtc()}catch(e){st('err');status('連線失敗',e.message||String(e));if(cam&&!raf)scan()}}
function makeFx(s){const A=window.AudioContext||window.webkitAudioContext,c=new A(),src=c.createMediaStreamSource(s),an=c.createAnalyser(),gate=c.createGain(),gain=c.createGain(),hp=c.createBiquadFilter(),co=c.createDynamicsCompressor(),de=c.createDelay(1.2),dry=c.createGain(),ed=c.createDelay(1),wet=c.createGain(),fb=c.createGain(),sum=c.createGain(),lim=c.createDynamicsCompressor(),dest=c.createMediaStreamDestination();an.fftSize=512;hp.type='highpass';hp.frequency.value=80;de.delayTime.value=0;ed.delayTime.value=.22;wet.gain.value=0;fb.gain.value=0;lim.threshold.value=-2;lim.ratio.value=20;src.connect(an);an.connect(gate);gate.connect(gain);gain.connect(hp);hp.connect(co);co.connect(de);de.connect(dry);dry.connect(sum);de.connect(ed);ed.connect(wet);wet.connect(sum);ed.connect(fb);fb.connect(ed);sum.connect(lim);lim.connect(dest);return{c,an,gate,gain,hp,co,de,wet,fb,dest,noise:50}}
function controls(){const bind=(id,out,fmt,apply)=>{const e=$(id),o=$(out),f=()=>{o.textContent=fmt(+e.value);apply(+e.value)};e.oninput=f;f()};bind('gain','gainOut',v=>v+'%',v=>fx.gain.gain.value=v/100);bind('delay','delayOut',v=>v+' ms',v=>fx.de.delayTime.value=v/1000);bind('noise','noiseOut',v=>v+'%',v=>fx.noise=v);bind('low','lowOut',v=>v+' Hz',v=>fx.hp.frequency.value=v);bind('comp','compOut',v=>v+'%',v=>{fx.co.threshold.value=-8-v*.22;fx.co.ratio.value=1+v*.09;fx.co.attack.value=.004;fx.co.release.value=.12});bind('echo','echoOut',v=>v+'%',v=>{const n=v/100;fx.wet.gain.value=n*.55;fx.fb.gain.value=n*.58});const a=new Float32Array(fx.an.fftSize);const g=()=>{gateRAF=requestAnimationFrame(g);fx.an.getFloatTimeDomainData(a);let q=0;for(const x of a)q+=x*x;const db=20*Math.log10(Math.sqrt(q/a.length)||1e-8),n=fx.noise;if(n<=0){fx.gate.gain.setTargetAtTime(1,fx.c.currentTime,.01);return}const th=-72+n*.40;fx.gate.gain.setTargetAtTime(db>th?1:.035,fx.c.currentTime,db>th?.008:.045)};g()}
const pcCfg={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};async function webrtc(){try{raw=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false},video:false});fx=makeFx(raw);ctx=fx.c;if(ctx.state==='suspended')await ctx.resume();controls();$('micCard').classList.remove('hidden');pc=new RTCPeerConnection(pcCfg);fx.dest.stream.getAudioTracks().forEach(t=>pc.addTrack(t,fx.dest.stream));pc.onicecandidate=e=>{if(e.candidate)obs.broadcast({role:'phone',kind:'ice',peerId,receiverId:receiver,candidate:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected'){st('ok');status('WebRTC 已連線');latency()}else if(s==='new'||s==='connecting')st('wait');else if(s==='failed'||s==='disconnected'){st('err');status('WebRTC 連線錯誤')}else if(s==='closed')st('idle')};const o=await pc.createOffer({offerToReceiveAudio:false});await pc.setLocalDescription(o);obs.broadcast({role:'phone',kind:'offer',peerId,sdp:pc.localDescription.sdp})}catch(e){st('err');status('麥克風 / WebRTC 啟動失敗',e.message||String(e))}}
async function signal(m){if(m.role!=='obs'||m.peerId!==peerId)return;if(m.kind==='answer'&&m.sdp){if(receiver&&m.receiverId!==receiver)return;if(!receiver)receiver=m.receiverId||null;try{if(!pc.remoteDescription){await pc.setRemoteDescription({type:'answer',sdp:m.sdp});for(const c of pending.splice(0))try{await pc.addIceCandidate(c)}catch{}}}catch(e){st('err');status('WebRTC Answer 失敗',e.message||String(e))}}else if(m.kind==='ice'&&m.candidate){if(receiver&&m.receiverId!==receiver)return;if(!receiver){pending.push(m.candidate);return}try{if(pc?.remoteDescription)await pc.addIceCandidate(m.candidate);else pending.push(m.candidate)}catch{}}}
function latency(){clearInterval(stats);stats=setInterval(async()=>{if(!pc||pc.connectionState!=='connected')return;try{const s=await pc.getStats();let r=null;s.forEach(x=>{if(x.type==='candidate-pair'&&x.state==='succeeded'&&x.currentRoundTripTime!=null){if(x.nominated||r===null)r=x.currentRoundTripTime*1000}});if(r!=null)$('latency').textContent=`連線延遲：約 ${Math.round(r/2)} ms（RTT ${Math.round(r)} ms）`}catch{}},1000)}
$('startScan').onclick=camera;camera();window.addEventListener('beforeunload',()=>{cancelAnimationFrame(raf);cancelAnimationFrame(gateRAF);clearInterval(stats);try{pc?.close()}catch{}try{obs?.ws?.close()}catch{}try{raw?.getTracks().forEach(t=>t.stop())}catch{}try{cam?.getTracks().forEach(t=>t.stop())}catch{}});})();
</script></body></html>
